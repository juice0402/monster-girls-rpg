<title>モン娘牧場 光の見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 1画面の見本：上に街の広場（ドット絵＋光の演出）、下に時間のボタン */
:root{
  --bg:#16141d;
  --btn:#2f2a3b;
  --ink:#efe6d4;
  --on:#f0c066;
  --on-ink:#2b1c08;
  --chip:rgba(18,14,26,.62);
  --font-ui:"DotGothic16","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--font-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 0}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#view{position:relative;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#clock{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:6px;background:var(--chip);font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#bar{flex:0 0 auto;display:flex;flex-direction:column;gap:8px;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
button{font-family:var(--font-ui);font-size:15px;color:var(--ink);background:var(--btn);border:0;border-radius:8px;padding:8px 12px;min-width:52px;cursor:pointer}
button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
</style>
<div id="app">
  <div id="stage"><div id="view"><canvas id="gl"></canvas><canvas id="fx"></canvas><div id="clock">春1日 12:00</div></div></div>
  <div id="bar">
    <div class="row" role="group" aria-label="時間">
      <button type="button" data-h="7">朝</button>
      <button type="button" data-h="12" aria-pressed="true">昼</button>
      <button type="button" data-h="17.4">夕方</button>
      <button type="button" data-h="21.5">夜</button>
      <button type="button" id="auto">自動</button>
    </div>
    <div class="row"><button type="button" id="fxbtn" aria-pressed="true">光の演出 あり</button></div>
  </div>
</div>
<script>
(()=>{
'use strict';
/* ===== 基本 ===== */
const SW=176,SH=304;
const C=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const R=a=>a.map(C);
function hash(x,y,s){let h=(x|0)*374761393+(y|0)*668265263+((s|0)+1)*1442695041;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const sm=t=>t*t*(3-2*t);
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);
  return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;}
const fbm=(x,y,s)=>vnoise(x,y,s)*.55+vnoise(x*2.1,y*2.1,s+7)*.3+vnoise(x*4.3,y*4.3,s+13)*.15;
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const dith=(x,y)=>(BAY[((y&3)<<2)|(x&3)]+.5)/16;
const quant=(v,x,y)=>{const lo=Math.floor(v);return (v-lo)>dith(x,y)?lo+1:lo;};
const clampI=(i,P)=>Math.max(0,Math.min(P.length-1,i));
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function Buf(w,h){const c=canvas(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data;
  return{c,w,h,d,
    set(x,y,col){x|=0;y|=0;if(x<0||y<0||x>=w||y>=h||!col)return;const i=(y*w+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255;},
    on(x,y){return x>=0&&y>=0&&x<w&&y<h&&d[(y*w+x)*4+3]>0;},
    done(){g.putImageData(id,0,0);return c;}};}
/* 1ドットごとに「色・面の向き・高さ/かげ/つや」を持つ絵 */
function Surf(w,h,base){
  const col=Buf(w,h),nrm=Buf(w,h),dat=Buf(w,h);
  const o={w,h,col,nrm,dat,base:base===undefined?h-1:base,
    put(x,y,c,n,ao,spec,z){x|=0;y|=0;if(x<0||y<0||x>=w||y>=h||!c)return;col.set(x,y,c);
      const l=Math.hypot(n[0],n[1],n[2])||1;nrm.set(x,y,[(n[0]/l*.5+.5)*255,(n[1]/l*.5+.5)*255,(n[2]/l*.5+.5)*255]);
      const zz=z===undefined?o.base-y:z;dat.set(x,y,[Math.max(0,Math.min(255,zz*3)),Math.max(0,Math.min(255,(ao===undefined?1:ao)*255)),(spec||0)*255]);},
    S(x,y,P,v,n,ao,spec,z){o.put(x,y,P[clampI(quant(v,x,y),P)],n,ao,spec,z);},
    on(x,y){return col.on(x,y);},
    clear(){col.d.fill(0);nrm.d.fill(0);dat.d.fill(0);},
    done(){return{col:col.done(),nrm:nrm.done(),dat:dat.done()};}};
  return o;}
function silhouette(src){const c=canvas(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);return c;}
/* 面の向き（東=x・南=y・上=z）。画面の上は「北と上のあいだ」、手前を向く面は「南と上のあいだ」 */
const NU=[0,0,1],NF=[0,1,0];
const sphereN=(sx,sy)=>{const z=Math.sqrt(Math.max(0,1-sx*sx-sy*sy));return[sx,.7071*(sy+z),.7071*(z-sy)];};
const cylN=u=>{u=Math.max(-1,Math.min(1,u));return[u,Math.sqrt(1-u*u),0];};

/* ===== 色（影は青むらさき寄り・光は黄色寄りにずらした段） ===== */
const GR=R(['#16352f','#1f4a36','#2b623c','#3a7c41','#4e9446','#66ab4f','#88c45c','#b2db73','#d9f096']);
const LEAF=R(['#12302d','#1a4434','#265c39','#357640','#4b9146','#6aac50','#93c962','#c3e384']);
const BLOS=R(['#4a2840','#6e3654','#94496a','#b9617e','#d98598','#efaab6','#fad0d6','#fff1f1']);
const BARK=R(['#2a1a14','#40271b','#5a3824','#78502f','#966a3e','#b0874f']);
const STONES=[R(['#4f4655','#6f6468','#8f8279','#ab9d8d','#c8baa5','#e0d4be']),
              R(['#574a46','#7b6a5c','#9c8a72','#baa78a','#d4c3a2','#e8dcbd']),
              R(['#454a5c','#61677a','#7f8492','#9da0aa','#bcbec3','#d8d9da']),
              R(['#5a4650','#7d6266','#9e7f7c','#bb9c93','#d4b8ab','#e8d3c4'])];
const MORTAR=R(['#272129','#332b33','#40373d']);
const CURB=R(['#4f4744','#7a6f66','#a19583','#c3b7a1','#ddd2bb','#f1e8d3']);
const IRON=R(['#15161f','#252838','#3a3f56','#565e7c','#7d86a6']);
const WOOD=R(['#2c1b13','#47301f','#68472c','#8a6038','#ab7c49','#c99a62']);
const PLAST=R(['#6f6052','#988670','#bfab8e','#dac8a8','#ece0c4','#f7efdc']);
const ROOF=R(['#182437','#1f324a','#2a4560','#375a76','#4a728b','#6890a2','#93b4bc']);
const BRICK=R(['#3a1d22','#5c2a2c','#80393a','#a24f48','#bf6e5c','#d79479']);
const GLASS=R(['#1b1e30','#282d46','#3a4463','#566b8b','#86a3bd','#c4dae5']);
const WATER=R(['#173a63','#1f5181','#296a9d','#3888ba','#53a6d2','#84c8e8','#bfe6f6','#f2fcff']);
const AWC=R(['#8f8167','#c9bb9a','#ebe0c5','#fbf4e2']),AWG=R(['#2f4f37','#46704a','#64935f','#8bb67b']);
const SACK=R(['#5a4128','#86643c','#ad8a55','#cdae74','#e6cf98']);
const FLW={pink:R(['#8f3553','#d0577a','#f38fa8','#ffc6d3']),yel:R(['#a06a17','#dea42a','#f6d453','#fff3a3']),
  wht:R(['#8a90a8','#cdd2e0','#f1f3f9','#ffffff']),blu:R(['#384390','#5468c9','#88a0ee','#c4d2ff']),red:R(['#6e1b26','#b02f39','#de574d','#f79179'])};

/* ===== 地面（草と石だたみ） ===== */
function inPlaza(x,y){
  const L=5,Rr=170,T=96,B=238,r=18;
  if(x>=L-2&&x<=Rr+2&&y>=T-2&&y<=B+2){const cx=Math.min(Math.max(x,L+r),Rr-r),cy=Math.min(Math.max(y,T+r),B-r);
    const wob=(vnoise(x*.35,y*.35,3)-.5)*2.4;if(Math.hypot(x-cx,y-cy)<=r+wob)return true;}
  if(x>=50&&x<=126&&y>=84&&y<=104)return true;
  if(y>=226){const w1=(vnoise(y*.2,1,5)-.5)*4,w2=(vnoise(y*.2,9,5)-.5)*4;if(x>=70+w1&&x<=106+w2)return true;}
  return false;}
const FC={x:88,y:172,rx:38,ry:27.5};      // 噴水のまわりのふち石（地面の丸。噴水と同じ見る角度＝たて0.72）
function ringAt(x,y){const ex=(x-FC.x)/FC.rx,ey=(y-FC.y)/FC.ry,q=Math.sqrt(ex*ex+ey*ey);
  if(q<.97||q>1.2)return null;const a=Math.atan2(ey,ex);return{rp:(q-.97)/.23,seg:Math.floor((a+Math.PI)/(Math.PI*2)*30),a};}

function makeGround(contacts){
  const s=Surf(SW,SH,0),mask=new Uint8Array(SW*SH),lab=new Int32Array(SW*SH).fill(-2),typ=new Uint8Array(SW*SH),aoA=new Float32Array(SW*SH).fill(1);
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++)mask[y*SW+x]=inPlaza(x,y)?1:0;
  const M=(x,y)=>x>=0&&y>=0&&x<SW&&y<SH?mask[y*SW+x]:0;
  for(const c of contacts){for(let j=-c.ry-1;j<=c.ry+1;j++)for(let i=-c.rx-1;i<=c.rx+1;i++){const q=(i*i)/(c.rx*c.rx)+(j*j)/(c.ry*c.ry),x=Math.round(c.x+i),y=Math.round(c.y+j);
    if(q>1.4||x<0||y<0||x>=SW||y>=SH)continue;aoA[y*SW+x]*=q<.5?.45:q<1?.62:.82;}}
  const AO=(x,y)=>aoA[Math.max(0,Math.min(SH-1,y))*SW+Math.max(0,Math.min(SW-1,x))];
  const gN=(x,y)=>[(vnoise(x*.45,y*.45,61)-.5)*.6,(vnoise(x*.45,y*.45,62)-.5)*.6,1];
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){
    const v=3.9+(fbm(x/26,y/26,1)-.5)*1.6+(vnoise(x/6,y/6,2)-.5)*.6-(y<40?.4:0);
    s.S(x,y,GR,Math.max(2.6,Math.min(5.4,v)),gN(x,y),AO(x,y),0,0);}
  const TUFT=[["6...6","5.7.5",".464.","..2.."],["7.6","5.5",".3."],[".7.","656",".3."],["6","4"],["7..7",".55.",".33."]];
  for(let cy=0;cy<SH/5;cy++)for(let cx=0;cx<SW/5+1;cx++){
    const h=hash(cx,cy,9);if(h<.18)continue;
    const px=cx*5+((hash(cx,cy,10)*5)|0)-1,py=cy*5+((hash(cx,cy,11)*5)|0)-2;
    if(hash(cx,cy,12)<.07){
      const P=[FLW.wht,FLW.yel,FLW.pink,FLW.blu][(hash(cx,cy,13)*4)|0];if(M(px+1,py+1))continue;const a=AO(px+1,py+1);
      s.put(px+1,py,P[3],[0,-.3,1],a,0,1);s.put(px,py+1,P[2],[-.5,0,1],a,0,1);s.put(px+2,py+1,P[2],[.5,0,1],a,0,1);s.put(px+1,py+2,P[1],[0,.5,1],a,0,1);
      s.put(px+1,py+1,P===FLW.yel?FLW.red[2]:FLW.yel[2],NU,a,0,1);s.put(px+1,py+3,GR[2],NU,a*.8,0,0);continue;}
    const T=TUFT[(hash(cx,cy,14)*TUFT.length)|0],sh=Math.round((fbm(px/26,py/26,1)-.5)*1.6);
    for(let j=0;j<T.length;j++)for(let i=0;i<T[j].length;i++){const ch=T[j][i];if(ch==='.')continue;
      const x=px+i,y=py+j;if(x<0||y<0||x>=SW||y>=SH)continue;if(M(x,y)&&!(M(x,y-2)===0&&hash(x,y,15)<.5))continue;
      const lean=(i-(T[j].length-1)/2)*.45,tip=(T.length-1-j)/T.length;
      s.put(x,y,GR[clampI(+ch+sh,GR)],[lean,.35-tip*.5,.85],AO(x,y)*(ch==='2'?.7:1),0,tip*2);}
  }
  // 石だたみ（ボロノイで石の形。ふちを丸めて、ひとつずつ少しふくらませる）
  const CW=7,CH=6,NX=Math.ceil(SW/CW)+4,NY=Math.ceil(SH/CH)+3,seeds=[];
  for(let cy=0;cy<NY;cy++)for(let cx=0;cx<NX;cx++){const off=(cy&1)?CW/2:0;
    const t=hash(cx,cy,13);seeds.push({x:(cx-2)*CW+off+CW/2+(hash(cx,cy,11)-.5)*3.4,y:(cy-1)*CH+CH/2+(hash(cx,cy,12)-.5)*2.6,t:t<.6?0:t<.9?1:t<.98?2:3,v:hash(cx,cy,17)});}
  const cen=new Float32Array(SW*SH*2);
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){if(!mask[y*SW+x])continue;
    const rg=ringAt(x,y);
    if(rg){const segFrac=((rg.a+Math.PI)/(Math.PI*2)*30)%1;lab[y*SW+x]=(rg.rp<.08||rg.rp>.92||segFrac<.11)?-1:100000+rg.seg;typ[y*SW+x]=9;
      const ac=((rg.seg+.55)/30)*Math.PI*2-Math.PI,qm=1.085;cen[(y*SW+x)*2]=FC.x+Math.cos(ac)*FC.rx*qm;cen[(y*SW+x)*2+1]=FC.y+Math.sin(ac)*FC.ry*qm;continue;}
    const gx=Math.floor(x/CW)+2,gy=Math.floor(y/CH)+1;let d1=1e9,d2=1e9,k1=-1;
    for(let j=gy-1;j<=gy+1;j++)for(let i=gx-2;i<=gx+2;i++){if(i<0||j<0||i>=NX||j>=NY)continue;const sd=seeds[j*NX+i];
      const dx=x-sd.x,dy=(y-sd.y)*1.12,d=Math.sqrt(dx*dx+dy*dy);if(d<d1){d2=d1;d1=d;k1=j*NX+i;}else if(d<d2)d2=d;}
    lab[y*SW+x]=(d2-d1<1.15)?-1:k1;typ[y*SW+x]=seeds[k1].t;cen[(y*SW+x)*2]=seeds[k1].x;cen[(y*SW+x)*2+1]=seeds[k1].y;}
  const L=(x,y)=>x>=0&&y>=0&&x<SW&&y<SH?lab[y*SW+x]:-2;
  const nearGrass=(x,y,r)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(!M(x+i,y+j))return true;return false;};
  for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){if(!mask[y*SW+x])continue;const l=lab[y*SW+x];
    const shadeTop=!M(x,y-1)||!M(x,y-2);const ao=AO(x,y)*(shadeTop?.62:1);
    if(l===-1){if(nearGrass(x,y,3)&&hash(x,y,22)<.55){s.S(x,y,GR,2.6+hash(x,y,23),gN(x,y),ao*.8,0,0);continue;}
      s.S(x,y,MORTAR,1.4+(hash(x,y,21)-.5)*.8,NU,ao*.55,0,0);continue;}
    const P=typ[y*SW+x]===9?CURB:STONES[typ[y*SW+x]];
    const up=L(x,y-1)!==l,lf=L(x-1,y)!==l,dn=L(x,y+1)!==l,rt=L(x+1,y)!==l;
    let v=3.05+(l>=100000?.35:(seeds[l].v-.5)*.55)+(hash(x,y,24)<.07?(hash(x,y,25)<.5?-.7:.7):0)+(vnoise(x/14,y/14,26)-.5)*.5;
    const cx=cen[(y*SW+x)*2],cy=cen[(y*SW+x)*2+1];
    const n=[(x-cx)*.09+(lf?-.75:0)+(rt?.75:0),(y-cy)*.1+(up?-.75:0)+(dn?.75:0),1];
    s.S(x,y,P,v,n,ao*(up||lf||dn||rt?.9:1),.08,0);
    if(nearGrass(x,y,1)&&hash(x,y,27)<.33)s.S(x,y,GR,4+hash(x,y,28)*1.3,gN(x,y),ao,0,0);
  }
  return s.done();
}

/* ===== 木 ===== */
function makeTree(seed,kind){
  const W=48,H=60,ax=24,ay=58,cl=[];
  const base=[[24,11,10],[13,19,9],[35,19,9],[24,21,11],[9,29,7.5],[39,29,7.5],[17,31,10],[31,31,10],[24,35,8]];
  for(const[x,y,r]of base)cl.push({x:x+(hash(x,y,seed)-.5)*2.6,y:y+(hash(y,x,seed)-.5)*2,r:r+(hash(x+y,3,seed)-.5)*1.4,ph:hash(x,y,seed+9)*6.28});
  cl.sort((a,b)=>a.y-b.y);
  const id=new Int8Array(W*H).fill(-1);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)for(let k=cl.length-1;k>=0;k--){const c=cl[k],dx=x-c.x,dy=(y-c.y)*1.05,a=Math.atan2(dy,dx);
    const rr=c.r+Math.sin(a*6+c.ph)*.85+Math.sin(a*11+c.ph*2)*.4;if(dx*dx+dy*dy<=rr*rr){id[y*W+x]=k;break;}}
  const inC=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&id[y*W+x]>=0;
  const P=kind==='blossom'?BLOS:LEAF;
  const can=Surf(W,H,ay),tr=Surf(W,H,ay);
  for(let y=ay-22;y<=ay;y++){const fl=y>ay-4?y-(ay-4):0,x0=ax-4-Math.floor(fl*.8),x1=ax+3+Math.floor(fl*.8);
    for(let x=x0;x<=x1;x++){const u=((x-x0)/(x1-x0))*2-1;let v=3.2+(hash(x,y>>2,51+seed)-.5)*.8;if(hash(x,0,52+seed)<.22)v-=.9;
      if(x===x0||x===x1||y===ay)v=Math.min(v,.8);const n=cylN(u*.95);if(fl)n[2]+=.4*fl/4;tr.S(x,y,BARK,v,n,y<ay-12?.45:1,0);}}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const k=id[y*W+x];if(k<0)continue;const c=cl[k];
    let sx=(x-c.x)/c.r,sy=(y-c.y)/c.r;sx+=(hash(x,y,seed+5)-.5)*.32;sy+=(hash(y,x,seed+6)-.5)*.32;
    const n=sphereN(Math.max(-1,Math.min(1,sx)),Math.max(-1,Math.min(1,sy)));
    let v=3.7+(hash(x,y,seed+8)-.5)*1.1-(y-20)/50*.4,ao=1-(y>30?(y-30)/40:0);
    const bk=dy=>inC(x,y+dy)&&id[(y+dy)*W+x]>k;
    if(bk(1)||bk(2)){v-=1.1;ao*=.55;}
    const up=inC(x,y-1)?id[(y-1)*W+x]:-1;if(up>=0&&up<k)v+=.6;
    let idx=Math.max(1,clampI(quant(v,x,y),P));
    if(!inC(x,y+1)||!inC(x+1,y)||!inC(x,y-1)||!inC(x-1,y)){idx=1;ao*=.8;}
    const col=(kind==='blossom'&&idx<=3&&hash(x,y,seed+7)<.5)?LEAF[idx+1]:P[idx];
    can.put(x,y,col,n,ao,kind==='blossom'?.05:.12);}
  if(kind==='blossom'){for(let n=0;n<40;n++){const x=(hash(n,1,seed)*W)|0,y=(hash(n,2,seed)*44)|0;if(inC(x,y)&&inC(x,y+1))can.put(x,y,BLOS[7],sphereN(0,-.3),1,0);}}
  const t=tr.done(),c=can.done(),all=canvas(W,H),g=all.getContext('2d');g.drawImage(t.col,0,0);g.drawImage(c.col,0,0);
  return{trunk:t,canopy:c,sil:silhouette(all),W,H,ax,ay};
}
function makeBush(seed){

  G.lp.fill(0);G.lc.fill(0);lights.slice(0,12).forEach((l,i)=>{G.lp.set([l[0],l[1],l[2],l[3]],i*4);G.lc.set([l[4],l[5],l[6],l[7]],i*4);});
  pass(G.lit,G.L,u=>{bt(0,G.alb,u.uAlb);bt(1,G.nrm,u.uNrm);bt(2,G.dat,u.uDat);bt(3,G.shd,u.uShd);bt(4,G.eN,u.uEmis);
    gl.uniform2f(u.uRes,SW,SH);gl.uniform1f(u.uFx,fxOn?1:0);gl.uniform1f(u.uShA,P.shA);gl.uniform1f(u.uQ,20);
    gl.uniform3fv(u.uSun,P.sun);gl.uniform3fv(u.uSunCol,P.sunCol);gl.uniform3fv(u.uSky,P.sky);gl.uniform3fv(u.uBounce,P.bounce);
    gl.uniform4fv(u.uL,G.lp);gl.uniform4fv(u.uLc,G.lc);});
  if(fxOn){
    pass(G.copy,G.A,u=>bt(0,G.L.t,u.uTex));blur2(G.A,G.B,1);blur2(G.A,G.B,2);
    pass(G.bright,G.Cc,u=>{bt(0,G.L.t,u.uLit);bt(1,G.eL,u.uEmis);gl.uniform1f(u.uThr,.8);});
    blur2(G.Cc,G.D,1);pass(G.copy,G.E,u=>bt(0,G.Cc.t,u.uTex));blur2(G.E,G.F,1);blur2(G.E,G.F,2);
  }
  const dx=Math.max(-1,Math.min(1,P.shK[0]/1.5)),rd=[dx*.62,.8],rl=Math.hypot(rd[0],rd[1]);
  pass(G.fin,null,u=>{bt(0,G.L.t,u.uLit);bt(1,G.A.t,u.uBlur);bt(2,G.Cc.t,u.uBloomA);bt(3,G.E.t,u.uBloomB);
    gl.uniform2f(u.uRes,SW,SH);gl.uniform1f(u.uTime,t);
    gl.uniform1f(u.uFocus,.6);gl.uniform1f(u.uDof,.7);gl.uniform1f(u.uBloom,P.bloom);gl.uniform1f(u.uRay,P.ray);gl.uniform1f(u.uFog,P.fog);
    gl.uniform1f(u.uSat,P.sat);gl.uniform1f(u.uCon,P.con);gl.uniform1f(u.uVig,P.vig);gl.uniform1f(u.uFx,fxOn?1:0);
    gl.uniform3fv(u.uRayCol,P.rayCol);gl.uniform3fv(u.uFogCol,P.fogCol);gl.uniform3fv(u.uLift,P.lift);gl.uniform3fv(u.uGain,P.gain);
    gl.uniform2f(u.uRayDir,rd[0]/rl,rd[1]/rl);gl.uniform2f(u.uRayOrg,dx>=0?-.05:SW/SH+.05,-.05);});
}

/* ===== 1コマずつ描く ===== */
function drawScene(t,P){
  blit(ground,0,0);
  for(const o of objs)o.draw(t);
  // 日のかげ（地面だけに落とす：物の上はぬきとる）
  shg.setTransform(1,0,0,1,0,0);shg.globalCompositeOperation='source-over';shg.clearRect(0,0,SW,SH);
  if(fxOn&&P.shA>.01){const kx=P.shK[0],ky=P.shK[1];
    for(const o of objs){if(!o.sil)continue;shg.setTransform(1,0,-kx,-ky,kx*o.ay,o.ay*(1+ky));shg.drawImage(o.sil,o.x,o.y);}
    shg.setTransform(1,0,0,1,0,0);shg.globalCompositeOperation='destination-out';for(const o of objs)if(o.sil)shg.drawImage(o.sil,o.x,o.y);shg.globalCompositeOperation='source-over';}
}
function drawEmis(t,P){
  eg.clearRect(0,0,SW,SH);if(!fxOn)return;
  if(P.lamp>.01){LAMPS.forEach(([x,ay],i)=>{const f=.9+.07*Math.sin(t*9+i*2)+.04*Math.sin(t*23+i);eg.globalAlpha=Math.min(1,P.lamp*f);
      eg.fillStyle='#ffd88e';eg.fillRect(x-2,ay-29,5,6);eg.fillStyle='#fff6d8';eg.fillRect(x-1,ay-28,3,3);});
    eg.globalAlpha=Math.min(1,P.lamp);eg.fillStyle='#ffd88e';eg.fillRect(LANTERN.x-1,LANTERN.y-2,3,5);eg.fillStyle='#fff3cf';eg.fillRect(LANTERN.x,LANTERN.y-1,1,3);}
  if(P.win>.01){eg.globalAlpha=P.win;for(const w of WINS){eg.fillStyle='#ffc46e';eg.fillRect(w.x,w.y,w.w,w.h);eg.fillStyle='#ffe4a6';eg.fillRect(w.x+1,w.y+1,w.w-2,w.h-3);
    eg.clearRect(w.mx,w.y,2,w.h);eg.clearRect(w.x,w.y+4,w.w,1);}}
  eg.globalAlpha=1;
}
function lightsFor(t,P){const L=[],base=SHOP.y+SHOP.H;
  LAMPS.forEach(([x,ay],i)=>{const f=.92+.06*Math.sin(t*9+i*2)+.03*Math.sin(t*23+i);L.push([x,ay+1,29,54,1,.74,.44,P.lamp*1.5*f]);});
  for(const w of WINS)L.push([w.x+w.w/2,base+3,12,40,1,.7,.4,P.win*1.25]);
  L.push([LANTERN.x,base+2,26,30,1,.72,.42,P.lamp*.9]);
  L.push([88,FC.y,14,36,.5,.72,1,P.night*.3]);
  return L;}

/* ===== つぶ（花びら・光のちり・ほたる） ===== */
const parts=[];let pscale=2;
function spawn(kind,init){const p={kind,t:0,ph:Math.random()*6.28};
  if(kind==='petal'){p.x=init?Math.random()*SW:SW+4+Math.random()*20;p.y=init?Math.random()*SH:-10+Math.random()*120;p.vx=-(5+Math.random()*9);p.vy=6+Math.random()*7;p.rot=Math.random()*6.28;p.spin=(Math.random()-.5)*5;p.s=.9+Math.random()*.5;}
  else if(kind==='mote'){p.x=Math.random()*SW;p.y=Math.random()*SH*.85;p.vx=(Math.random()-.5)*2;p.vy=-(1+Math.random()*2);p.life=5+Math.random()*5;p.s=.5+Math.random()*.7;}
  else{p.x=Math.random()*SW;p.y=200+Math.random()*100;if(Math.random()<.45){p.x=Math.random()<.5?Math.random()*30:SW-Math.random()*30;p.y=40+Math.random()*120;}p.seed=Math.random()*100;}
  parts.push(p);}
const COUNT={petal:16,mote:22,fly:11};
function dofAt(y){const d=Math.abs(y/SH-.6);return Math.max(0,Math.min(1,(d-.2)/.32))*.8;}
function drawParts(dt,t,P){
  const k=pscale;fctx.setTransform(1,0,0,1,0,0);fctx.clearRect(0,0,fxc.width,fxc.height);if(!fxOn)return;
  const tint=P.sunCol.map((v,i)=>Math.min(1,v*.8+P.sky[i]*1.2+.15));
  for(const kind in COUNT){const n=parts.filter(p=>p.kind===kind).length,want=kind==='fly'?Math.round(COUNT.fly*P.night):kind==='mote'?Math.round(COUNT.mote*Math.min(1,P.ray*1.2+.15)):COUNT.petal;
    for(let i=n;i<want;i++)spawn(kind,true);}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;
    if(p.kind==='petal'){p.x+=(p.vx+Math.sin(t*1.7+p.ph)*4)*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;if(p.x<-8||p.y>SH+8){parts.splice(i,1);spawn('petal',false);continue;}
      const b=dofAt(p.y),s=p.s*(1+b*1.6)*k,a=(.9-b*.5)*(.4+.6*Math.min(1,P.sunAmt+.25));
      fctx.save();fctx.translate(p.x*k,p.y*k);fctx.rotate(p.rot);fctx.scale(1,.25+.75*Math.abs(Math.cos(p.rot*1.3+p.ph)));
      fctx.globalAlpha=a;fctx.fillStyle=`rgb(${255*tint[0]|0},${205*tint[1]|0},${218*tint[2]|0})`;
      fctx.beginPath();fctx.ellipse(0,0,s*1.3,s*.8,0,0,6.283);fctx.fill();fctx.restore();}
    else if(p.kind==='mote'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life){parts.splice(i,1);continue;}
      const a=Math.sin(p.t/p.life*Math.PI)*(.4+.6*Math.sin(t*3+p.ph)**2)*Math.min(1,P.ray*1.3)*.8,b=dofAt(p.y),r=(p.s+b*1.4)*k*1.4;
      if(a<.02)continue;const g=fctx.createRadialGradient(p.x*k,p.y*k,0,p.x*k,p.y*k,r);const c=P.rayCol.map(v=>Math.min(255,v*255+40)|0);
      g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`);g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);fctx.globalCompositeOperation='lighter';fctx.fillStyle=g;fctx.fillRect(p.x*k-r,p.y*k-r,r*2,r*2);fctx.globalCompositeOperation='source-over';}
    else{p.x+=Math.sin(t*.7+p.seed)*6*dt+Math.sin(t*1.9+p.seed*2)*4*dt;p.y+=Math.cos(t*.6+p.seed*1.3)*5*dt;
      if(P.night<.05&&Math.random()<dt){parts.splice(i,1);continue;}
      const pulse=Math.max(0,Math.sin(t*2.2+p.seed*3)),a=pulse*P.night,b=dofAt(p.y),r=(2.6+pulse*2.2+b*2)*k;if(a<.02)continue;
      const g=fctx.createRadialGradient(p.x*k,p.y*k,0,p.x*k,p.y*k,r);g.addColorStop(0,`rgba(240,255,170,${a})`);g.addColorStop(.25,`rgba(200,255,120,${a*.55})`);g.addColorStop(1,'rgba(160,255,90,0)');
      fctx.globalCompositeOperation='lighter';fctx.fillStyle=g;fctx.fillRect(p.x*k-r,p.y*k-r,r*2,r*2);fctx.globalCompositeOperation='source-over';}}
  fctx.globalAlpha=1;
}

/* ===== 画面の大きさ・ボタン ===== */
const view=document.getElementById('view'),stage=document.getElementById('stage'),clock=document.getElementById('clock');
let fallback=null;
function resize(){const aw=stage.clientWidth,ah=stage.clientHeight;let s=Math.min(aw/SW,ah/SH);if(s>=2)s=Math.floor(s);s=Math.max(1,s);
  view.style.width=SW*s+'px';view.style.height=SH*s+'px';const dpr=Math.min(window.devicePixelRatio||1,2);
  glc.width=Math.round(SW*s*dpr);glc.height=Math.round(SH*s*dpr);fxc.width=glc.width;fxc.height=glc.height;pscale=s*dpr;
  if(fallback)fallback.imageSmoothingEnabled=false;}
const btns=[...document.querySelectorAll('button[data-h]')],autoBtn=document.getElementById('auto'),fxBtn=document.getElementById('fxbtn');
function press(){btns.forEach(b=>b.setAttribute('aria-pressed',String(!auto&&+b.dataset.h===target)));autoBtn.setAttribute('aria-pressed',String(auto));}
btns.forEach(b=>b.addEventListener('click',()=>{auto=false;target=+b.dataset.h;press();}));
autoBtn.addEventListener('click',()=>{auto=!auto;if(auto)target=hour;press();});
fxBtn.addEventListener('click',()=>{fxOn=!fxOn;fxBtn.setAttribute('aria-pressed',String(fxOn));fxBtn.textContent=fxOn?'光の演出 あり':'光の演出 なし';});

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(auto){hour+=dt*.45;if(hour>=26)hour=6;target=hour;}else hour+=(target-hour)*Math.min(1,dt*2.2);
  const P=paramsAt(hour);
  drawScene(t,P);drawEmis(t,P);
  if(G)renderGL(t,P,lightsFor(t,P));else if(fallback){fallback.drawImage(scene,0,0,glc.width,glc.height);}
  drawParts(dt,t,P);
  const hh=Math.floor(hour)%24,mm=Math.floor((hour%1)*6)*10;clock.textContent=`春1日 ${hh}:${String(mm).padStart(2,'0')}`;
  requestAnimationFrame(frame);}
function boot(){build();ground=makeGround(contacts);
  resize();addEventListener('resize',resize);
  if(!initGL()){fallback=glc.getContext('2d');if(fallback)fallback.imageSmoothingEnabled=false;fxBtn.hidden=true;}
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){COUNT.petal=6;COUNT.mote=8;}
  window.__hikari={set(h){auto=false;target=hour=h;press();},fx(v){if(v!==fxOn)fxBtn.click();}};
  requestAnimationFrame(frame);}
boot();
})();
</script>
