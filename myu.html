function makeAnchors(c){const cv=document.createElement('canvas');cv.width=c.w;cv.height=c.h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.drawImage(c.img,0,0,c.w,c.h);const alpha=ctx.getImageData(0,0,c.w,c.h).data;const opaque=(x,y)=>x>=0&&y>=0&&x<c.w&&y<c.h&&alpha[(Math.floor(y)*c.w+Math.floor(x))*4+3]>135;
