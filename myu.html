<script>

const back=$('#back').getContext('2d'), stage=$('#stage').getContext('2d'), fx=$('#fx').getContext('2d');
const idle=$('#idle'), attack=$('#attack');
const cfg={

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const smooth=x=>{x=clamp(x,0,1);return x*x*(3-2*x)};
function scale(){world.style.transform=`scale(${view.clientWidth/780})`} window.addEventListener('resize',scale); scale();
function ellipse(c,x,y,rx,ry,fill,stroke=null,lw=1){c.beginPath(); c.ellipse(x,y,rx,ry,0,0,Math.PI*2); if(fill){c.fillStyle=fill;c.fill()} if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}
function glow(c,x,y,r,strength,col='93,200,255'){const g=c.createRadialGradient(x,y,1,x,y,r); g.addColorStop(0,`rgba(${col},${strength})`); g.addColorStop(1,`rgba(${col},0)`); c.fillStyle=g; c.fillRect(x-r,y-r,2*r,2*r)}
function puddle(power){
  back.clearRect(0,0,780,510);
  const g=back.createLinearGradient(0,0,0,510); g.addColorStop(0,'#202b50'); g.addColorStop(.55,'#0f1734'); g.addColorStop(1,'#09111f'); back.fillStyle=g; back.fillRect(0,0,780,510);
  back.strokeStyle='#6780a91c'; for(let i=0;i<8;i++){back.beginPath(); back.moveTo(0,350+i*22); back.lineTo(780,350+i*22); back.stroke()}
  const puddles=[
    {x:215,y:462,rx:54,ry:12,a:.95},{x:268,y:469,rx:68,ry:15,a:1.0},{x:314,y:459,rx:42,ry:10,a:.78},
    {x:178,y:470,rx:28,ry:7,a:.58},{x:372,y:471,rx:38,ry:9,a:.70},{x:244,y:451,rx:23,ry:6,a:.44}
  ];
  glow(back,260,459,132,.05+.10*power,'123,226,255');
  glow(back,256,462,88,.04+.08*power,'170,115,255');
  for(const p of puddles){
    back.save(); back.translate(p.x,p.y);
    back.beginPath(); back.moveTo(-p.rx*.96,0); back.bezierCurveTo(-p.rx*.92,-p.ry*.85,-p.rx*.30,-p.ry*1.25,0,-p.ry*.95); back.bezierCurveTo(p.rx*.34,-p.ry*1.22,p.rx*.98,-p.ry*.56,p.rx,0); back.bezierCurveTo(p.rx*.96,p.ry*.84,p.rx*.22,p.ry*1.08,0,p.ry*.88); back.bezierCurveTo(-p.rx*.28,p.ry*1.14,-p.rx*.98,p.ry*.72,-p.rx*.96,0); back.closePath();
    const fill=back.createLinearGradient(0,-p.ry*1.3,0,p.ry*1.1); fill.addColorStop(0,`rgba(122,244,255,${(.11+.08*power)*p.a})`); fill.addColorStop(.5,`rgba(89,164,238,${(.22+.11*power)*p.a})`); fill.addColorStop(1,`rgba(28,78,122,${(.42+.13*power)*p.a})`); back.fillStyle=fill; back.fill();
    back.strokeStyle=`rgba(199,248,255,${(.16+.18*power)*p.a})`; back.lineWidth=1.4; back.stroke();
    back.restore();
  }
  const gleams=[{x:228,y:459,rx:20,ry:4,a:.08},{x:274,y:466,rx:24,ry:5,a:.11},{x:308,y:456,rx:14,ry:3,a:.08}];
  for(const g2 of gleams){ ellipse(back,g2.x,g2.y,g2.rx,g2.ry,`rgba(255,255,255,${g2.a+.06*power})`) }
}

function enemy(t,hit){
  stage.clearRect(0,0,780,510); ellipse(stage,681,444,54,9,'#061029bd'); glow(stage,683,354,74,.12+hit*.32,'170,87,245');
  const squash=1+Math.sin(t*2)*.025; stage.save(); stage.translate(680,391); stage.scale(squash,1/squash);
  let g=stage.createLinearGradient(-52,-72,52,40); g.addColorStop(0,'#c398ff'); g.addColorStop(.48,'#865ce1'); g.addColorStop(1,'#48338a'); stage.fillStyle=g;
  stage.beginPath(); stage.moveTo(-51,5); stage.bezierCurveTo(-58,-51,-26,-77,0,-77); stage.bezierCurveTo(36,-77,53,-37,54,5); stage.bezierCurveTo(59,44,-53,42,-51,5); stage.fill();
  ellipse(stage,-17,-18,4.5,6,'#ffffff'); ellipse(stage,18,-18,4.5,6,'#fff'); stage.strokeStyle='#331f60'; stage.lineWidth=2; stage.beginPath(); stage.arc(0,-4,9,.05,Math.PI-.05); stage.stroke(); stage.restore();
  if(hit>0){glow(stage,682,352,96,hit*.35,'179,240,255'); stage.fillStyle=`rgba(225,250,255,${hit})`; stage.font='bold 22px system-ui'; stage.fillText('−428',637,276-hit*30)}
}
function drawIdleMotes(t){
  for(const m of motes){
    const x=208+Math.cos(t*m.spd+m.off)*m.r*.55 + Math.sin(t*.7+m.off*.7)*10;
    const y=300 - ((t*18+m.off*12)%m.h);
    glow(fx,x,y,4+m.size,m.size<3?.22:.28,'138,233,255');
    fx.fillStyle='rgba(194,239,255,.42)'; fx.beginPath(); fx.ellipse(x,y,m.size,m.size*.72,0,0,Math.PI*2); fx.fill();
  }
}
function drawThread(startX,startY,length,wide,alpha,seed){
  if(length<3) return; fx.save(); fx.globalAlpha=alpha;
  const wig=Math.sin(now*1.1+seed)*1.1, tipY=startY+length;
  const grad=fx.createLinearGradient(startX-wide,startY,startX+wide,tipY); grad.addColorStop(0,'#83f0ff'); grad.addColorStop(.45,'#7dbefb'); grad.addColorStop(1,'#b18ef8'); fx.fillStyle=grad;
  fx.beginPath(); fx.moveTo(startX-wide*.70,startY-1); fx.bezierCurveTo(startX-wide,startY+length*.26,startX+wig-wide*.22,startY+length*.68,startX+wig-wide*.52,tipY); fx.bezierCurveTo(startX+wig-wide*.96,tipY+wide*.95,startX+wig+wide*.96,tipY+wide*.95,startX+wig+wide*.52,tipY); fx.bezierCurveTo(startX+wig+wide*.22,startY+length*.68,startX+wide,startY+length*.26,startX+wide*.70,startY-1); fx.closePath(); fx.fill();
  fx.strokeStyle='rgba(245,255,255,.48)'; fx.lineWidth=Math.max(.7,wide*.14); fx.beginPath(); fx.moveTo(startX-wide*.22,startY+1); fx.quadraticCurveTo(startX-wide*.28,startY+length*.62,startX+wig-wide*.05,tipY); fx.stroke(); fx.restore();
}
function drawGooForPose(key, active){
  if(!$('#gooToggle').checked) return;
  const c=cfg[key];
  c.anchors.forEach((a,i)=>{
    const baseX=c.x+a.x, baseY=c.y+a.y;
    const cyc=(now*.26+i*.18)%1; const amt=cyc<.78?smooth(cyc/.78):Math.pow(clamp((1-cyc)/.22,0,1),1.8);
    const extra=active?4:0; const length=amt*(16+(i%3)*6+extra); const wide=3.2+(i%4)*.45;
    drawThread(baseX,baseY,length,wide,active?.82:.52,i*1.31);
    const split=(cyc>.79&&cyc<.81);
    if(split && !a._done){ a._done=true; falling.push({x:baseX,y:baseY+length,r:3.5+wide*.42,v:18,age:0,life:4,phase:i*.66}) }
    if(cyc<.55) a._done=false;
    if($('#debug').checked) ellipse(fx,baseX,baseY,3.3,3.3,'#ff587e','#fff',1);
  })
}
function updateDrops(dt){
  for(let i=falling.length-1;i>=0;i--){const d=falling[i]; d.age+=dt; d.v+=105*dt; d.y+=d.v*dt; d.x+=Math.sin(now*1.1+d.phase)*.12; if(d.y>463){ splats.push({x:d.x,age:0,r:d.r}); falling.splice(i,1); continue;} if(d.age>d.life){falling.splice(i,1); continue;} const alpha=1-d.age/d.life;
    const grad=fx.createLinearGradient(d.x-6,d.y-10,d.x+6,d.y+7); grad.addColorStop(0,`rgba(194,255,255,${alpha})`); grad.addColorStop(1,`rgba(123,130,245,${alpha})`); fx.fillStyle=grad;
    fx.beginPath(); fx.moveTo(d.x-1,d.y-d.r*2); fx.bezierCurveTo(d.x-d.r,d.y-d.r,d.x-d.r,d.y+d.r,d.x,d.y+d.r*1.08); fx.bezierCurveTo(d.x+d.r,d.y+d.r,d.x+d.r,d.y-d.r,d.x+1,d.y-d.r*2); fx.closePath(); fx.fill(); }
  for(let i=splats.length-1;i>=0;i--){const s=splats[i]; s.age+=dt; if(s.age>2.2){splats.splice(i,1); continue;} const q=1-s.age/2.2; fx.fillStyle=`rgba(92,176,235,${.18*q})`; fx.strokeStyle=`rgba(170,244,255,${.38*q})`; fx.lineWidth=1; fx.beginPath(); fx.moveTo(s.x-8,463); fx.bezierCurveTo(s.x-6,458,s.x+6,458,s.x+8,463); fx.bezierCurveTo(s.x+6,467,s.x-6,467,s.x-8,463); fx.closePath(); fx.fill(); fx.stroke(); }
}
function castEffects(phase){
  const puddlePower = phase<0?0:phase<.75?smooth(phase/.75):phase<2.4?1:1-smooth((phase-2.4)/1.6); puddle(puddlePower);
  const active = phase>=0&&phase<4.2;
  if(active){
    if(phase>=.65){
      const p=phase<1.7?smooth((phase-.65)/1.05):1-Math.max(0,phase-2.2)*.25;
      const x=438,y=250; // shift forward so fingers remain visible
      glow(fx,x,y,42,p*.20,'114,233,255');
      fx.strokeStyle=`rgba(162,243,255,${p*.55})`; fx.lineWidth=1.5;
      fx.beginPath(); fx.ellipse(x,y,18+Math.sin(now*3)*1.1,15+Math.cos(now*2.6)*0.8,0,0,Math.PI*2); fx.stroke();
      for(let k=0;k<7;k++){
        const a=now*1.8+k*.9, r=10+((k*6+phase*18)%11);
        glow(fx,x+Math.cos(a)*r,y+Math.sin(a)*r,3.2,p*.42,'186,242,255');
      }
      // slime wisps around hand
      for(let k=0;k<3;k++){
        const ox=x-18+k*12, oy=y+8+k*2;
        fx.strokeStyle=`rgba(125,222,255,${p*.28})`; fx.lineWidth=4-k;
        fx.beginPath(); fx.moveTo(ox,oy); fx.quadraticCurveTo(ox+12,oy+10,ox+18,oy+26); fx.stroke();
      }
    }
    if(phase>=1.78&&phase<2.9){
      const p=smooth((phase-1.78)/.78); const x=440+230*p, y=258+38*p;
      glow(fx,x,y,30,.48,'129,240,255');
      const grad=fx.createLinearGradient(x-18,y-14,x+18,y+18); grad.addColorStop(0,'rgba(210,255,255,.88)'); grad.addColorStop(.45,'rgba(121,219,255,.90)'); grad.addColorStop(1,'rgba(135,120,247,.82)');
      fx.fillStyle=grad; fx.beginPath(); fx.ellipse(x,y,15,12,0,0,Math.PI*2); fx.fill();
      // sticky blobs + trail
      fx.strokeStyle='rgba(140,225,255,.42)'; fx.lineWidth=5; fx.lineCap='round'; fx.beginPath(); fx.moveTo(430,260); fx.quadraticCurveTo((430+x)/2-8,(260+y)/2+8,x-7,y); fx.stroke();
      for(let i=0;i<3;i++){ const q=i/2, bx=430+(x-430)*q, by=188+(y-188)*q + Math.sin(now*3+i)*4; glow(fx,bx,by,8-2*i,.26,'150,235,255'); fx.fillStyle='rgba(134,210,255,.32)'; fx.beginPath(); fx.ellipse(bx,by,5-1*i,3.5-0.6*i,0,0,Math.PI*2); fx.fill(); }
    }
    if(phase>=2.52&&phase<3.4){
      const p=Math.sin(Math.PI*smooth((phase-2.52)/.88)); const x=680,y=350; glow(fx,x,y,74,p*.46,'132,233,255');
      fx.strokeStyle=`rgba(178,247,255,${p*.44})`; fx.lineWidth=2.2;
      for(let r of [18,31,43]){ fx.beginPath(); fx.ellipse(x,y+4,r,r*.58,0,0,Math.PI*2); fx.stroke(); }
      for(let k=0;k<5;k++){
        const a=k*Math.PI/2.5+now*.55; fx.strokeStyle=`rgba(122,219,255,${p*.36})`; fx.lineWidth=4;
        fx.beginPath(); fx.moveTo(x+Math.cos(a)*14,y+Math.sin(a)*7); fx.quadraticCurveTo(x+Math.cos(a)*30,y+Math.sin(a)*18,x+Math.cos(a)*48,y+Math.sin(a)*16); fx.stroke();
      }
    }
  } else puddle(0);
}

function label(p){return p<0?'🫧 待機':p<.75?'💧 粘液が集まる':p<1.78?'🔮 詠唱 / 凝縮':p<2.52?'⚡ ゲル弾発射':p<3.4?'💥 拘束ヒット':'✨ 余韻'}
function startCast(t){castStart=t; falling.length=Math.min(falling.length,48)}
function update(t,dt){ const phase=castStart<0?-1:t-castStart; if(phase>4.4){castStart=-1; autoAt=t+1.8}
  const active=phase>=0&&phase<4.4, attackOn=phase>1.05&&phase<3.2;
  const swapIn=attackOn ? (phase<1.25?smooth((phase-1.05)/.20): phase>2.95?1-smooth((phase-2.95)/.25):1) : 0;
  idle.style.opacity=1-swapIn; attack.style.opacity=swapIn;
  const breath = Math.sin(t*1.7)*.0048; idle.style.transform=`scale(${1-breath*.22},${1+breath})`; attack.style.transform=`scale(${1-breath*.12},${1+breath*.46})`;
  fx.clearRect(0,0,780,510); castEffects(phase); drawIdleMotes(t); drawGooForPose(attackOn?'attack':'idle',active); updateDrops(dt); enemy(t, phase>=2.52&&phase<3.35 ? 1-smooth((phase-2.52)/.83):0);
  $('#phase').textContent=label(phase); $('#progress').style.width=`${active?Math.max(0,phase/4.4*100):0}%`; $('#readout').textContent=active?'スライムだまり → 詠唱 → 右向き攻撃 → 粘性ゲル弾 → 余韻':'待機中：控えめな呼吸＋体表に沿った粘液。';
  if($('#auto').checked && castStart<0 && t>=autoAt) startCast(t);
}
function frame(ts){ const dt=Math.min(.042,(ts-prev)/1000); prev=ts; if(!paused){ now+=dt; update(now,dt) } requestAnimationFrame(frame) } requestAnimationFrame(frame);
$('#cast').onclick=()=>startCast(now); $('#pause').onclick=()=>{paused=!paused; $('#pause').textContent=paused?'再生':'一時停止'}; $('#auto').onchange=()=>autoAt=now+1.3;
})();
</script></body></html>
