<!-- 自動で作るファイル・手で直さない（src/ を直して node tools/build.mjs。地図は docs/MAP.md） -->
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モン娘牧場 試作1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 縦持ち1画面：地図は画面いっぱい。上の文字・下の道具・ふきだし・まどは、枠なし・半透明で地図に重ねる */
:root{
  --ground:#1c2b22;
  --wood:#6b4426;
  --wood-d:#43281a;
  --wood-l:#8f6038;
  --paper:#fbf1da;
  --paper-d:#e9d8b4;
  --ink:#3a2618;
  --leaf:#7cc35e;
  --leaf-d:#4f8f3a;
  --heart:#ff6b8f;
  --sun:#ffd25e;
  /* 地図に重ねる物の色：うすい暗さ・細い光の線・うすい文字・えらんだ物の金色 */
  --veil:linear-gradient(rgba(8,10,16,0),rgba(8,10,16,.7) 34px,rgba(8,10,16,.88));
  --chip:rgba(255,240,210,.08);
  --line:rgba(255,236,200,.2);
  --dim:rgba(251,241,218,.64);
  --gold-bg:rgba(255,210,94,.2);
  --gold-glow:0 0 0 1px #ffd25e,0 0 12px rgba(255,210,94,.45);
  --shade:0 1px 0 rgba(0,0,0,.75),0 0 6px rgba(0,0,0,.45);
  --font:'DotGothic16','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ground)}
body{font-family:var(--font);color:var(--paper);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--ground)}

/* 上：枠をつくらず地図に重ねる。文字が読めるように、上だけうすく暗く */
#hud{position:absolute;left:0;right:0;top:0;z-index:12;pointer-events:none;padding:8px max(12px,env(safe-area-inset-left,0px)) 24px max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto;gap:5px 8px;align-items:center;background:linear-gradient(rgba(8,10,16,.6),rgba(8,10,16,.26) 58%,rgba(8,10,16,0));text-shadow:0 1px 0 rgba(0,0,0,.75),0 0 6px rgba(0,0,0,.5)}
#hud .when{display:flex;gap:10px;align-items:baseline;font-size:14px;white-space:nowrap;color:var(--paper)}
#clock{font-size:22px;color:var(--sun);font-variant-numeric:tabular-nums;letter-spacing:.5px}
#money{justify-self:end;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--paper)}
#money::after{content:"G";margin-left:3px;color:var(--sun)}
.st{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--paper)}
.st .bar{width:110px;height:6px;border-radius:3px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,240,210,.25);position:relative;overflow:hidden}
.st .bar i{position:absolute;inset:0;width:100%;border-radius:3px;background:linear-gradient(90deg,#6fbf55,#b7e27a);box-shadow:0 0 6px rgba(160,230,110,.55);transition:width .2s}
.hudbtns{justify-self:end;display:flex;gap:6px;pointer-events:auto}
.hb{background:rgba(12,14,22,.46);border:1px solid rgba(255,236,200,.3);border-radius:999px;padding:4px 10px;font-size:12px;line-height:1.2;color:var(--paper);text-shadow:none}
.hb[aria-pressed="true"]{background:rgba(255,210,94,.9);border-color:#fff2c4;color:var(--ink)}

/* まん中 */
#stage{position:absolute;inset:0;overflow:hidden;background:#24351f}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#gl,#pfx{position:absolute;left:0;top:0;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-100%);font-size:13px;color:#fff;text-shadow:1px 1px 0 #2c1a10,-1px 1px 0 #2c1a10,1px -1px 0 #2c1a10,-1px -1px 0 #2c1a10;white-space:nowrap;animation:up 1.2s ease-out forwards}
.ft.heart{color:var(--heart)}
.ft.money{color:var(--sun)}
@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}
/* 頭の上のひとこと：枠なしの暗い半透明 */
.bub{position:absolute;transform:translate(-50%,-100%);background:rgba(12,14,22,.72);color:var(--paper);border-radius:8px;padding:3px 8px;font-size:12px;white-space:nowrap;max-width:220px;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-4px;border:4px solid transparent;border-top-color:rgba(12,14,22,.72)}
#toast{position:absolute;left:50%;top:66px;z-index:13;transform:translateX(-50%);background:rgba(12,14,22,.7);border:1px solid rgba(255,236,200,.3);border-radius:10px;padding:6px 12px;font-size:13px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .25s}
#toast.off{opacity:0}

/* 下：道具の列も枠なしで地図に重ねる。下だけうすく暗く */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:12;pointer-events:none;padding:24px max(10px,env(safe-area-inset-left,0px)) 10px max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:flex-end;background:linear-gradient(rgba(8,10,16,0),rgba(8,10,16,.3) 40%,rgba(8,10,16,.66))}
#bar>*{pointer-events:auto}
#hotbar{flex:1;display:flex;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
#hotbar::-webkit-scrollbar{display:none}
.slot{flex:none;position:relative;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:50px;padding:5px 3px 3px;background:rgba(12,14,22,.52);border:1px solid rgba(255,236,200,.22);border-radius:10px;font-size:10px;line-height:1.1;color:var(--paper)}
.slot img{width:28px;height:28px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.slot b{position:absolute;right:4px;top:2px;font-weight:normal;font-size:10px;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #000}
.slot.empty img{opacity:.4}
.slot[aria-pressed="true"]{background:rgba(255,210,94,.22);border-color:#ffd25e;box-shadow:0 0 0 1px #ffd25e,0 0 12px rgba(255,210,94,.5);color:#fff3cc}
.slot[aria-pressed="true"] b{text-shadow:0 1px 0 #000}
.slot.gap{margin-left:8px}
#recenter{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:94px;z-index:13;background:rgba(12,14,22,.6);border:1px solid rgba(255,236,200,.3);border-radius:999px;color:var(--paper);padding:6px 12px;font-size:13px}
.big{flex:none;min-width:54px;align-self:stretch;background:rgba(12,14,22,.52);border:1px solid rgba(255,236,200,.3);border-radius:10px;font-size:13px;padding:4px 6px;color:var(--paper)}

/* ふきだしとまど：下の道具の列と同じく、枠なしで地図に重ねる（下へいくほど暗く）。出ている間は下の道具の列と「自分にもどる」をかくす */
#app:has(#dlg:not([hidden])) #bar,#app:has(#modal:not([hidden])) #bar,
#app:has(#dlg:not([hidden])) #recenter{visibility:hidden}

/* ふきだし */
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--veil);color:var(--paper);text-shadow:var(--shade);padding:40px max(14px,env(safe-area-inset-left,0px)) 14px max(14px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
#dlg.noface{grid-template-columns:1fr}
#dlg.noface #face{display:none}
#face{width:56px;height:56px;border-radius:12px;background:radial-gradient(circle at 50% 42%,rgba(255,236,200,.3),rgba(255,236,200,.08) 72%);box-shadow:inset 0 0 0 1px var(--line);image-rendering:pixelated;grid-row:span 2;align-self:start}
#dname{font-size:13px;color:var(--sun);letter-spacing:.5px;align-self:end}
#dtext{font-size:16px;line-height:1.6;min-height:3.2em;grid-column:2;white-space:pre-wrap}
#dlg.noface #dtext,#dlg.noface #dname{grid-column:1}
#dnext{position:absolute;right:14px;bottom:10px;font-size:12px;color:var(--sun);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#dopts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#dopts button{flex:1 1 40%;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--paper);text-shadow:inherit;padding:10px 6px;font-size:15px}
#dopts button.primary{background:var(--gold-bg);border-color:var(--sun);box-shadow:var(--gold-glow);color:#fff3cc}

/* まど（店・出荷・かばん・地図・なかよし）：下から重なる暗い帯。上はうすく、地図が見えたまま */
#modal{position:absolute;inset:0;background:linear-gradient(rgba(8,10,16,.12),rgba(8,10,16,.4));display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{width:100%;max-height:84%;display:flex;flex-direction:column;background:var(--veil);color:var(--paper);text-shadow:var(--shade);padding:40px max(14px,env(safe-area-inset-left,0px)) 14px max(14px,env(safe-area-inset-right,0px))}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:normal;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:13px;color:var(--sun)}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;scrollbar-width:none}
.plist::-webkit-scrollbar{display:none}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:7px 9px;background:var(--chip);border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,236,200,.12)}
.row img,.row canvas{width:32px;height:32px;image-rendering:pixelated;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.row .t{min-width:0}
.row .t div:first-child{font-size:15px}
.row .t div+div{font-size:12px;color:var(--dim);margin-top:2px}
.row .acts{display:flex;gap:5px}
.kind{font-size:12px;color:var(--dim)}
.pbtn{background:var(--gold-bg);border:1px solid var(--sun);border-radius:9px;color:#fff3cc;text-shadow:inherit;box-shadow:0 0 8px rgba(255,210,94,.3);padding:7px 11px;font-size:14px}
.pbtn.sub{background:var(--chip);border-color:var(--line);color:var(--paper);box-shadow:none}
.pbtn:disabled{opacity:.35;box-shadow:none}
.close{margin-top:10px;align-self:stretch;background:var(--chip);border:1px solid var(--line);border-radius:10px;color:var(--paper);text-shadow:inherit;padding:10px;font-size:15px}
#dopts button:active,.pbtn:not(:disabled):active,.close:active{filter:brightness(1.3)}
.hearts{color:var(--heart);letter-spacing:1px;font-size:13px}
.hearts i{font-style:normal;color:rgba(255,240,210,.22)}
.note{font-size:12px;color:var(--dim);margin:6px 2px 0;line-height:1.5}

#fade{position:absolute;inset:0;background:#0d0d14;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#fade.on{opacity:1;pointer-events:auto}
#fade .d{font-size:24px;color:var(--sun)}
#fade .l{font-size:15px;line-height:1.7}

#title{position:absolute;inset:0;z-index:50;background:linear-gradient(#7fc4e8 0 38%,#9ed37c 38% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink);padding:24px}
#title canvas{width:288px;height:144px;image-rendering:pixelated;max-width:100%}
#title h1{margin:0;font-size:30px;font-weight:normal;letter-spacing:2px;text-shadow:2px 2px 0 var(--paper)}
#title p{margin:0;font-size:13px}
#title .tb{display:flex;flex-direction:column;gap:8px;width:220px}
#title button{background:var(--paper);border:3px solid var(--ink);color:var(--ink);padding:10px;font-size:17px}
#title button.go{background:var(--leaf)}
@media (prefers-reduced-motion:reduce){.ft{animation-duration:.01s}#fade{transition:none}#dnext{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="when"><span id="date">春 1日（月）</span><span id="clock">6:00</span></div>
    <div id="money">300</div>
    <div class="st"><span>体力</span><span class="bar"><i id="stbar"></i></span></div>
    <div class="hudbtns">
      <button class="hb" id="lightBtn" hidden>光 中</button>
      <button class="hb" id="ffBtn" aria-pressed="false">早送り</button>
      <button class="hb" id="friendBtn">なかよし</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="gl" hidden></canvas>
    <canvas id="cv"></canvas>
    <canvas id="pfx" hidden></canvas>
    <div id="fx"></div>
    <div id="toast" class="off"></div>
    <button id="recenter" hidden>自分にもどる</button>
    <div id="dlg" hidden>
      <canvas id="face" width="16" height="16"></canvas>
      <div id="dname"></div>
      <div id="dtext"></div>
      <div id="dopts" hidden></div>
      <div id="dnext" hidden>▼</div>
    </div>
  </main>
  <footer id="bar">
    <div id="hotbar"></div>
    <button class="big" id="bagBtn">かばん</button>
    <button class="big" id="mapBtn">地図</button>
  </footer>
  <div id="modal" hidden><div class="panel" id="panel"></div></div>
  <div id="fade"></div>
  <div id="title">
    <canvas id="tcv" width="96" height="48"></canvas>
    <h1>モン娘×牧場</h1>
    <p>試作1　春の28日</p>
    <div class="tb">
      <button class="go" id="contBtn" hidden>つづきから</button>
      <button id="newBtn">はじめから</button>
    </div>
  </div>

// 絵の枠は体（16×32）のまわりに、横4・上4ドットのゆとり（帽子のつばなどがはみ出せる）

function charFrame(id,view,f,flip,wear){

  // 着せかえ：身につけた物（帽子など）を上に重ねる。'.' はすけて下の体が見える
  // 部品の rows はゆとりこみの枠（横24）で、y 段目から。c は帽子のふくらみの丸 [x,y,半径]
  for(const k in(wear||{})){const it=wear[k]&&C.items&&C.items[wear[k]],L=it&&it.views[view];if(!L)continue;if(L.c)hatc=L.c;
    rows=rows.map((r,y)=>{const o=L.rows[y-L.y];if(!o)return r;let t='';for(let x=0;x<W;x++)t+=o[x]!=='.'?o[x]:r[x];return t;});}

  const hx=(flip?15-C.head[0]:C.head[0])+PADX,hy=C.head[1]+PADY,hr=C.head[2];let hasEm=false;

    else if(pt!=='ol'){let a0=x,a1=x;while(a0>0&&at(a0-1,y)&&at(a0-1,y)[1]===pt)a0--;while(a1<W-1&&at(a1+1,y)&&at(a1+1,y)[1]===pt)a1++;

        N=[u*.8,Math.sqrt(Math.max(0,1-u*u*.64))*.95,(pt==='sk'?.05:.18)+top];}}

function nput(x,y,n,z,ao,spec){if(!NB)return;x|=0;y|=0;if(x<0||y<0||x>=NB.w||y>=NB.h)return;
  const i=(y*NB.w+x)*4,l=Math.hypot(n[0],n[1],n[2])||1;
  NB.n[i]=(n[0]/l*.5+.5)*255;NB.n[i+1]=(n[1]/l*.5+.5)*255;NB.n[i+2]=(n[2]/l*.5+.5)*255;
  NB.d[i]=Math.max(0,Math.min(255,(z||0)*3));NB.d[i+1]=(ao===undefined?1:ao)*255;NB.d[i+2]=(spec||0)*255;}
// 四角に同じ向き（n は向き か (i,j)=>向き）。zb を渡すと「zb から上へのたかさ」
function nrect(x,y,w,h,n,zb,ao,spec){if(!NB)return;const f=typeof n==='function';
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)nput(x+i,y+j,f?n(i,j):n,zb==null?0:Math.max(0,zb-(y+j)),ao,spec);}
// 色の明るさを高さとみなして、1ドットずつのでこぼこを足す（同じ向きの面の中だけ）
function bumpLum(cd,n,d,w,h,k){
  const L=new Float32Array(w*h);for(let i=0;i<w*h;i++){const a=cd[i*4+3];L[i]=a<160?-1:(cd[i*4]*.299+cd[i*4+1]*.587+cd[i*4+2]*.114)/255;}
  const out=new Uint8ClampedArray(n);
  const same=(i,j)=>L[j]>=0&&Math.abs(n[i*4]-n[j*4])<12&&Math.abs(n[i*4+1]-n[j*4+1])<12&&Math.abs(n[i*4+2]-n[j*4+2])<12;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(L[i]<0||d[i*4+2]>140)continue;
    const c=L[i],hl=x>0&&same(i,i-1)?L[i-1]:c,hr=x<w-1&&same(i,i+1)?L[i+1]:c,hu=y>0&&same(i,i-w)?L[i-w]:c,hd=y<h-1&&same(i,i+w)?L[i+w]:c;
    const dx=(hr-hl)*.5,dy=(hd-hu)*.5,nx=n[i*4]/127.5-1,ny=n[i*4+1]/127.5-1,nz=n[i*4+2]/127.5-1;
    const bl=Math.hypot(ny,nz)||1,by=nz/bl,bz=-ny/bl;   // 画面の下へ向かう面の向き（n × 東）
    const ox=nx-k*dx,oy=ny-k*dy*by,oz=nz-k*dy*bz,l=Math.hypot(ox,oy,oz)||1;
    out[i*4]=(ox/l*.5+.5)*255;out[i*4+1]=(oy/l*.5+.5)*255;out[i*4+2]=(oz/l*.5+.5)*255;
    if(c<.2)d[i*4+1]=Math.min(d[i*4+1],200);}   // いちばん暗い線はすこし陰に
  return out;}
function bufCanvas(w,h,data){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),id=g.createImageData(w,h);id.data.set(data);g.putImageData(id,0,0);return c;}

      nput(x,y,y>=Y+rh-1?[e*.4,.9,.42]:[e*.55,.3+.4*t,.95-.3*t],wh+(Y+rh-y)*.7+1,1,.05);}}

const GR={b:'#6db34b',d:'#579d3d',dd:'#468a32',l:'#87c95c',h:'#a6dd73'};
function tuft(g,x,y,big){
  pset(g,x,y+2,GR.dd);pset(g,x+4,y+2,GR.dd);pset(g,x+1,y+2,GR.d);pset(g,x+2,y+2,GR.dd);pset(g,x+3,y+2,GR.d);
  pset(g,x+1,y+1,GR.l);pset(g,x+3,y+1,GR.l);pset(g,x+2,y+1,GR.d);pset(g,x+2,y,GR.h);
  if(big){pset(g,x,y+1,GR.l);pset(g,x+4,y,GR.h);pset(g,x+4,y+1,GR.l);}
}
function drawGrass(g,x,y,field){
  const X=x*TS,Y=y*TS;g.fillStyle=field?'#74b74f':GR.b;g.fillRect(X,Y,TS,TS);
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){const h=hash(X+i,Y+j);if(h<.018)pset(g,X+i,Y+j,GR.d);}
  const n=field?2:3+((hash(x,y)*2)|0);
  for(let k=0;k<n;k++){const h1=hash(x*3+k*17,y*5+k*31),h2=hash(y*7+k*13,x*11+k*3);tuft(g,X+((h1*12)|0),Y+1+((h2*12)|0),h1>.55);}
  if(field){const h=hash(x+9,y+4);if(h>.55){pset(g,X+((h*13)|0),Y+((h*29)|0)%14,'#a78a55');pset(g,X+((h*13)|0)+1,Y+((h*29)|0)%14,'#8e7246');}}

/* ---- 土の道（草とのさかいめは草がかぶさる） ---- */
const DIRT={b:'#d4a66b',d:'#bd8d55',dd:'#9e7140',l:'#e6c18a'};
const isPathT=(m,x,y)=>{const t=tile(m,x,y);return t==='p'||t==='k';};
function drawPath(g,x,y){
  const X=x*TS,Y=y*TS,m=RBM;g.fillStyle=DIRT.b;g.fillRect(X,Y,TS,TS);
  for(let j=0;j<16;j++)for(let i=0;i<16;i++){const h=hash(X+i+500,Y+j);if(h<.06)pset(g,X+i,Y+j,DIRT.d);else if(h>.96)pset(g,X+i,Y+j,DIRT.l);}
  for(let k=0;k<2;k++){const h=hash(x*5+k*7+300,y*3+k);if(h<.5)continue;const px=X+2+((h*97)|0)%11,py=Y+2+((h*53)|0)%11;
    g.fillStyle=DIRT.dd;g.fillRect(px,py+1,3,1);g.fillStyle='#c9ad86';g.fillRect(px,py,3,1);pset(g,px+1,py,'#e8d6b6');}
  const edge=(side)=>{for(let k=0;k<16;k++){const d=1+(hash(X+k*3+side,Y+side*7)>.55?1:0)+(hash(X+side,Y+k*5)>.88?1:0);
    for(let s=0;s<=d;s++){const c=s<d?(s===d-1&&hash(k,side+s)>.5?GR.l:GR.b):DIRT.dd;
      const [px,py]=side===0?[X+k,Y+s]:side===1?[X+k,Y+15-s]:side===2?[X+s,Y+k]:[X+15-s,Y+k];pset(g,px,py,c);}}};
  if(!isPathT(m,x,y-1))edge(0);if(!isPathT(m,x,y+1))edge(1);if(!isPathT(m,x-1,y))edge(2);if(!isPathT(m,x+1,y))edge(3);
}

/* ---- 木（まわりの森。となりと重なる丸い木） ---- */
const TREE={o:'#1d4a2a',d:'#2b6638',m:'#3c8344',l:'#55a24e',h:'#7fc45c',tr:'#6b4529',trd:'#4c2f1b',trl:'#8c5f38'};
function drawTree(g,x,y){
  const X=x*TS,Y=y*TS,h=hash(x,y),h2=hash(y+3,x+7);
  const cx=X+8+((h*3)|0)-1,cy=Y+6+((h2*3)|0)-1,r=9.2+h2*.8;
  if(tile(RBM,x,y+1)!=='T'){g.fillStyle='rgba(20,50,20,.35)';g.fillRect(X+3,Y+14,11,2);
    g.fillStyle=TREE.trd;g.fillRect(X+6,Y+9,5,6);g.fillStyle=TREE.tr;g.fillRect(X+6,Y+9,3,6);g.fillStyle=TREE.trl;g.fillRect(X+7,Y+10,1,4);
    nrect(X+6,Y+9,5,6,i=>cylN((i-2)/2.6),Y+15,.85,0);}
  for(let j=-12;j<=12;j++)for(let i=-12;i<=12;i++){
    const d=Math.hypot(i,j*1.08),a=Math.atan2(j,i),rr=r+Math.sin(a*5+h*9)*1.1+Math.sin(a*9+h2*5)*.5;
    if(d>rr)continue;const px=cx+i,py=cy+j;
    if(d>rr-1.1){pset(g,px,py,TREE.o);nput(px,py,sphereN(i/rr,j/rr),Y+19-py,.7,0);continue;}
    const s=(-(i*.62+j*.78))/rr+(hash(px*3,py*5)-.5)*.32;
    pset(g,px,py,s>.5?TREE.h:s>.12?TREE.l:s>-.32?TREE.m:TREE.d);nput(px,py,sphereN(i/rr*.92,j/rr*.92),Y+19-py,1,.04);
  }
  // 葉のかたまりの光
  for(let k=0;k<3;k++){const hx=cx-5+((hash(x*7+k,y)*8)|0),hy=cy-6+((hash(x,y*7+k)*7)|0);pset(g,hx,hy,TREE.h);pset(g,hx+1,hy,'#a5dc78');pset(g,hx,hy+1,TREE.l);}
}

const WOOD={o:'#4e311c',d:'#87562e',b:'#b37b45',l:'#d8a466',h:'#ecc48a'};
function drawFence(g,m,x,y){const X=x*TS,Y=y*TS;drawGrass(g,x,y);

  g.fillStyle='rgba(25,60,20,.3)';

  if(U)nrect(X+6,Y,4,4,i=>cylN((i-1.5)/2),Y+14);if(D)nrect(X+6,Y+13,4,3,i=>cylN((i-1.5)/2),Y+16);

/* ---------- 街の絵（3枚組で1ドットずつ描く。光の見本 art-samples/hikari.html と同じ描き方） ---------- */
const C3=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const R3=a=>a.map(C3);
function h3(x,y,s){let h=(x|0)*374761393+(y|0)*668265263+((s|0)+1)*1442695041;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
const sm3=t=>t*t*(3-2*t);
function vn3(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=sm3(x-xi),yf=sm3(y-yi),a=h3(xi,yi,s),b=h3(xi+1,yi,s),c=h3(xi,yi+1,s),d=h3(xi+1,yi+1,s);return a+(b-a)*xf+(c-a)*yf+(a-b-c+d)*xf*yf;}
const BAY4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const dq=(v,x,y)=>{const lo=Math.floor(v);return(v-lo)>(BAY4[((y&3)<<2)|(x&3)]+.5)/16?lo+1:lo;};
const ci=(i,P)=>Math.max(0,Math.min(P.length-1,i));
// 色の段（影は青むらさき寄り・光は黄色寄り）
const PS={

         R3(['#544542','#77605a','#957b6f','#b29683','#cdb39c','#e3cdb5']),R3(['#4b4d44','#6b6f5d','#8a8e74','#a8ab8c','#c4c6a6','#dddfc0'])],
  mortar:R3(['#272129','#332b33','#40373d']),curb:R3(['#4f4744','#7a6f66','#a19583','#c3b7a1','#ddd2bb','#f1e8d3']),
  iron:R3(['#15161f','#252838','#3a3f56','#565e7c','#7d86a6']),wood:R3(['#2c1b13','#47301f','#68472c','#8a6038','#ab7c49','#c99a62']),
  plast:R3(['#6f6052','#988670','#bfab8e','#dac8a8','#ece0c4','#f7efdc']),brick:R3(['#3a1d22','#5c2a2c','#80393a','#a24f48','#bf6e5c','#d79479']),
  glass:R3(['#1b1e30','#282d46','#3a4463','#566b8b','#86a3bd','#c4dae5']),water:R3(['#173a63','#1f5181','#296a9d','#3888ba','#53a6d2','#84c8e8','#bfe6f6','#f2fcff']),

  awc:R3(['#8f8167','#c9bb9a','#ebe0c5','#fbf4e2']),awg:R3(['#2f4f37','#46704a','#64935f','#8bb67b']),
  leaf:R3(['#12302d','#1a4434','#265c39','#357640','#4b9146','#6aac50','#93c962','#c3e384']),
  sack:R3(['#5a4128','#86643c','#ad8a55','#cdae74','#e6cf98']),
  flw:[R3(['#8f3553','#d0577a','#f38fa8','#ffc6d3']),R3(['#a06a17','#dea42a','#f6d453','#fff3a3']),R3(['#8a90a8','#cdd2e0','#f1f3f9','#ffffff']),R3(['#6e1b26','#b02f39','#de574d','#f79179'])],
};
/* 1ドットごとに「色・面の向き・高さ/かげ/つや」を持つ絵 */
function Surf3(w,h,base){const col=new Uint8ClampedArray(w*h*4),nrm=new Uint8ClampedArray(w*h*4),dat=new Uint8ClampedArray(w*h*4);
  const o={w,h,col,nrm,dat,base:base===undefined?h-1:base,
    put(x,y,c,n,ao,spec,z){x|=0;y|=0;if(x<0||y<0||x>=w||y>=h||!c)return;const i=(y*w+x)*4,l=Math.hypot(n[0],n[1],n[2])||1;
      col[i]=c[0];col[i+1]=c[1];col[i+2]=c[2];col[i+3]=255;nrm[i]=(n[0]/l*.5+.5)*255;nrm[i+1]=(n[1]/l*.5+.5)*255;nrm[i+2]=(n[2]/l*.5+.5)*255;nrm[i+3]=255;
      const zz=z===undefined?o.base-y:z;dat[i]=Math.max(0,Math.min(255,zz*3));dat[i+1]=(ao===undefined?1:ao)*255;dat[i+2]=(spec||0)*255;dat[i+3]=255;},
    S(x,y,P,v,n,ao,spec,z){o.put(x,y,P[ci(dq(v,x,y),P)],n,ao,spec,z);},
    on(x,y){return x>=0&&y>=0&&x<w&&y<h&&col[(y*w+x)*4+3]>0;},
    clear(){col.fill(0);nrm.fill(0);dat.fill(0);},
    cv(){return{c:bufCanvas(w,h,col),n:bufCanvas(w,h,nrm),d:bufCanvas(w,h,dat)};}};
  return o;}
// 土台に3枚とも写す（地面の高さは0のまま。物の高さは自分の足もとから）
function stamp3(g,o,X,Y){g.drawImage(bufCanvas(o.w,o.h,o.col),X,Y);if(!NB)return;
  for(let y=0;y<o.h;y++)for(let x=0;x<o.w;x++){const i=(y*o.w+x)*4;if(!o.col[i+3])continue;const wx=X+x,wy=Y+y;if(wx<0||wy<0||wx>=NB.w||wy>=NB.h)continue;const j=(wy*NB.w+wx)*4;
    for(let k=0;k<3;k++){NB.n[j+k]=o.nrm[i+k];NB.d[j+k]=o.dat[i+k];}}}
function sil3(o){const d=new Uint8ClampedArray(o.w*o.h*4);for(let i=0;i<o.w*o.h;i++)if(o.col[i*4+3])d[i*4+3]=255;return bufCanvas(o.w,o.h,d);}

/* ---- 家：屋根は手前にかたむいた面、壁は手前向きの面（壁の種類・窓・戸・えんとつ・ひさし・かんばん） ---- */

// 畑のどのマスにも歩いて行けるように、道をふさぐ岩を間引く
function fixRocks(F){
  const open=(x,y)=>{const t=tile('farm',x,y);return !(BLOCK.has(t)||t==='A')&&!F.rock[I(x,y)];};
  for(let guard=0;guard<80;guard++){
    const seen=new Uint8Array(MW*MH);const q=[I(7,8)];seen[q[0]]=1;
    while(q.length){const c=q.pop();const cx=c%MW,cy=(c/MW)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy,ni=I(nx,ny);if(!seen[ni]&&open(nx,ny)){seen[ni]=1;q.push(ni);}}}
    let bad=-1;for(let y=9;y<=19&&bad<0;y++)for(let x=3;x<=12;x++){const i=I(x,y);if(!F.rock[i]&&!seen[i]){bad=i;break;}}
    if(bad<0)return;
    // ふさがれた場所のまわりの岩を1つどける（外とつながる岩を優先）
    const reg=new Uint8Array(MW*MH);const st=[bad];reg[bad]=1;const rocks=[];
    while(st.length){const c=st.pop();const cx=c%MW,cy=(c/MW)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy,ni=I(nx,ny);if(reg[ni])continue;if(F.rock[ni]){reg[ni]=1;rocks.push(ni);}else if(open(nx,ny)){reg[ni]=1;st.push(ni);}}}
    const good=rocks.find(ri=>DIRS.some(([dx,dy])=>seen[I(ri%MW+dx,((ri/MW)|0)+dy)]));
    F.rock[good!=null?good:rocks[0]]=0;
    if(!rocks.length)return;
  }
}

const P={x:3,y:6,path:[],dir:0,speed:5,anim:0,act:null,task:null,tries:0};

const Q=[];
function moveAlong(e,dt,speed){
  if(!e.path.length)return false;
  const [tx,ty]=e.path[0];const dx=tx-e.x,dy=ty-e.y;const d=Math.hypot(dx,dy);const step=speed*dt;
  if(Math.abs(dx)>Math.abs(dy))e.dir=dx>0?3:2;else if(dy!==0)e.dir=dy>0?0:1;
  if(step>=d){e.x=tx;e.y=ty;e.path.shift();}else{e.x+=dx/d*step;e.y+=dy/d*step;}
  e.anim+=dt;return true;
}
function bfs(m,sx,sy,isGoal){
  const prev=new Int16Array(MW*MH).fill(-1),seen=new Uint8Array(MW*MH);const st=I(sx,sy);const q=[st];seen[st]=1;let h=0;
  while(h<q.length){const c=q[h++];const cx=c%MW,cy=(c/MW)|0;
    if(isGoal(cx,cy)){const path=[];let k=c;while(k!==st){path.push([k%MW,(k/MW)|0]);k=prev[k];}return{path:path.reverse(),end:[cx,cy]};}
    for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=I(nx,ny);if(seen[ni]||blocked(m,nx,ny))continue;seen[ni]=1;prev[ni]=c;q.push(ni);}
  }
  return null;
}
const near=(ax,ay,bx,by,d)=>Math.abs(ax-bx)+Math.abs(ay-by)<=d;
function faceTo(e,tx,ty){const dx=tx-e.x,dy=ty-e.y;if(Math.abs(dx)>Math.abs(dy))e.dir=dx>0?3:2;else if(dy!==0)e.dir=dy>0?0:1;}

function schedule(id){
  const t=S.time,n=S.npc[id];
  if(id==='chloe'){
    if(S.reno.state===1&&t>=420&&t<1020)return{map:'farm',mode:'build',x:9,y:6};
    if(n.live){
      if(t<420)return{map:'farm',mode:'idle',x:5,y:7};
      if(t<720)return{map:'farm',mode:'rocks'};
      if(t<1020)return{map:'town',mode:'idle',x:4,y:6,anim:true};
      if(t<1260)return{map:'farm',mode:'wander',area:[4,6,14,7]};
      return{hidden:true};
    }
    if(t<480||t>=1260)return{hidden:true};
    if(t<1080)return{map:'town',mode:'idle',x:4,y:6,anim:true};
    return{map:'town',mode:'wander',area:[3,8,6,10]};
  }
  if(id==='luu'){
    if(n.live){if(t>=1140)return{hidden:true};return{map:'farm',mode:'water'};}
    if(t<420||t>=1140)return{hidden:true};
    return{map:'town',mode:'wander',area:[5,8,10,13]};

const DBGN={};   // 試す用：人をその場に立たせる
function updNpc(id,dt){
  const r=RT[id],sc=schedule(id);
  if(DBGN[id]){const q=DBGN[id];Object.assign(r,{map:q[0],x:q[1],y:q[2],dir:q[3],hidden:false,path:[],act:null,task:null});return;}
  if(sc.hidden){r.hidden=true;r.path=[];r.task=null;r.act=null;return;}
  if(r.hidden||r.map!==sc.map){r.hidden=false;r.map=sc.map;const sp=spawnFor(id,sc);r.x=sp[0];r.y=sp[1];r.path=[];r.task=null;r.act=null;}
  if(r.bub>0)r.bub-=dt;
  if(r.wait>0){r.wait-=dt;if(r.path.length>1)r.path=r.path.slice(0,1);moveAlong(r,dt,r.speed);return;}
  if(r.act){r.act.t+=dt;if(r.act.t>=r.act.dur){const a=r.act;r.act=null;a.done&&a.done();}return;}
  if(moveAlong(r,dt,r.speed))return;
  r.idle=(r.idle||0)-dt;
  const m=sc.mode;
  if(m==='idle'||m==='build'){
    if(r.x!==sc.x||r.y!==sc.y){if(!npcPath(r,(x,y)=>x===sc.x&&y===sc.y)){r.x=sc.x;r.y=sc.y;}return;}
    if(m==='build'){r.dir=1;if(r.idle<=0){r.idle=.7;r.act={t:0,dur:.35,done:()=>dust(10*TS,5*TS+8,'#c8925a',4)};}}
    else{r.dir=0;if(sc.anim&&r.idle<=0){r.idle=2+Math.random()*3;r.dir=3;r.act={t:0,dur:.4,done:()=>dust(5*TS+8,6*TS+6,'#ffb347',3)};}}
    return;
  }
  if(m==='wander'){if(r.idle<=0){const t=randTile(r.map,sc.area);if(t)npcPath(r,(x,y)=>x===t[0]&&y===t[1]);r.idle=2+Math.random()*4;}return;}
  if(m==='rocks'||m==='water'){
    const isT=m==='rocks'?(x,y)=>S.farm.rock[I(x,y)]===1:(x,y)=>{const c=S.farm.crop[I(x,y)];return c&&!c.ready&&!S.farm.wet[I(x,y)];};
    if(r.task){const[tx,ty]=r.task;
      if(!isT(tx,ty)){r.task=null;return;}
      faceTo(r,tx,ty);
      if(m==='rocks'){r.hits=(r.hits||0)+1;r.act={t:0,dur:.45,done:()=>{dust(tx*TS+8,ty*TS+8,'#9d978a',5);
        if(r.hits>=3){r.hits=0;r.task=null;S.farm.rock[I(tx,ty)]=0;S.inv.stone+=2;fxText(tx*TS+8,ty*TS,'+2 石');if(Math.random()<.35)bubble(id,pick(DLG.chloe.work));}}};}
      else{r.act={t:0,dur:.5,done:()=>{splash(tx*TS+8,ty*TS+8);S.farm.wet[I(tx,ty)]=1;r.task=null;if(Math.random()<.15)bubble(id,pick(DLG.luu.work));}};}
      return;
    }
    if(r.idle>0)return;
    const res=bfs(r.map,Math.round(r.x),Math.round(r.y),(x,y)=>{for(const[dx,dy]of DIRS)if(isT(x+dx,y+dy))return true;return m==='water'&&isT(x,y);});
    if(res){r.path=res.path;const[ex,ey]=res.end;if(m==='water'&&isT(ex,ey))r.task=[ex,ey];else for(const[dx,dy]of DIRS)if(isT(ex+dx,ey+dy)){r.task=[ex+dx,ey+dy];break;}}
    else{const t=randTile(r.map,m==='rocks'?[4,6,14,7]:[8,21,10,22]);if(t)npcPath(r,(x,y)=>x===t[0]&&y===t[1]);r.idle=3+Math.random()*4;}
  }

// 手に持っている物（item）でこのマスに何ができるか。文字列＝できる作業、{need}／{done}＝できない理由、null＝作業なし（歩く）
function canAct(x,y,item){
  if(S.map!=='farm')return null;const i=I(x,y),t=tile('farm',x,y);item=item||S.hand;
  if(S.farm.rock[i])return item==='pick'?'rock':{need:'岩はハンマーでくだこう'};
  if(S.farm.flower[i])return'flower';
  if(t!=='f')return null;
  const soil=S.farm.soil[i],c=S.farm.crop[i],wet=S.farm.wet[i];
  if(c&&c.ready)return'harvest';
  if(item==='hoe'&&!soil)return'till';
  if(item==='can'&&soil)return wet?{done:'ここは今日もう水をやったよ'}:'water';
  if(CROPS[item]&&soil&&!c)return S.seeds[item]>0?'plant':{need:`${CROPS[item].name}の種がない。街の種屋で買えるよ`};
  const need=!soil?'耕すならクワに持ちかえてね':!c?'種をえらぶと、ここにまけるよ':!wet?'水やりはじょうろに持ちかえてね':null;
  return need?{need}:null;
}
function queueField(x,y){
  const k=canAct(x,y,S.hand);
  if(!k)return false;
  if(typeof k==='object'){toast(k.need||k.done);return true;}
  if(Q.some(t=>t.kind==='field'&&t.x===x&&t.y===y)||(P.task&&P.task.kind==='field'&&P.task.x===x&&P.task.y===y))return true;
  if(Q.length>=12){toast('予約は12マスまで');return true;}
  Q.push({kind:'field',x,y,item:S.hand});return true;
}
function startTask(t){
  P.task=t;P.tries=(P.tries||0);
  let goal;
  if(t.kind==='walk')goal=(x,y)=>x===t.x&&y===t.y;
  else if(t.kind==='field'){const self=!blocked('farm',t.x,t.y);goal=(x,y)=>near(x,y,t.x,t.y,1)&&(self||!(x===t.x&&y===t.y));}
  else if(t.kind==='npc'){const r=RT[t.id];if(!r||r.hidden||r.map!==S.map){P.task=null;return;}const nx=Math.round(r.x),ny=Math.round(r.y);r.wait=5;goal=(x,y)=>near(x,y,nx,ny,1)&&!(x===nx&&y===ny);}
  else if(t.kind==='bld'){goal=(x,y)=>x===t.sx&&y===t.sy;}
  const res=bfs(S.map,Math.round(P.x),Math.round(P.y),goal);
  if(!res){if(t.kind!=='walk')toast('岩にふさがれて行けない。手前の岩からくだこう');P.task=null;return;}
  P.path=res.path;
}
function updPlayer(dt){
  if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur){const a=P.act;P.act=null;a.done();}return;}
  if(moveAlong(P,dt,P.speed))return;
  if(P.task){const t=P.task;P.task=null;arrive(t);return;}
  if(Q.length)startTask(Q.shift());
}
async function arrive(t){
  if(t.kind==='field'){faceTo(P,t.x,t.y);doField(t.x,t.y,t.item);}
  else if(t.kind==='npc'){const r=RT[t.id];if(r&&!r.hidden&&r.map===S.map&&near(Math.round(P.x),Math.round(P.y),Math.round(r.x),Math.round(r.y),1.5)){faceTo(P,r.x,r.y);faceTo(r,P.x,P.y);r.wait=2;P.tries=0;await openNpc(t.id);r.wait=1;}
    else if((P.tries=(P.tries||0)+1)<4)startTask(t);else P.tries=0;}
  else if(t.kind==='bld'){if(t.face)P.dir=t.face;await interact(t.id);}
}
function doField(x,y,item){
  item=item||S.hand;const k=canAct(x,y,item),i=I(x,y);
  if(!k||typeof k==='object')return;   // 予約のあいだに様子が変わった
  const need=k==='till'?COST.till:k==='water'?COST.water:k==='rock'?COST.rock:0;
  if(need&&S.stamina<need){toast('つかれて動けない…今日は家で休もう');Q.length=0;return;}
  const tool=TOOLS[item]&&(k==='till'||k==='water'||k==='rock')?item:null;
  P.act={t:0,dur:k==='rock'?.5:.28,tool,done:()=>{
    S.stamina-=need;
    if(k==='till'){S.farm.soil[i]=1;dust(x*TS+8,y*TS+10,'#8a5a35',5);hint('till','つぎは下の道具から種をえらんで、耕したマスをタップ');}
    else if(k==='plant'){S.seeds[item]--;S.farm.crop[i]={id:item,d:0,ready:false};hint('plant','じょうろに持ちかえて水やり。毎日やると育つよ');}
    else if(k==='water'){S.farm.wet[i]=1;splash(x*TS+8,y*TS+8);}
    else if(k==='harvest'){const c=S.farm.crop[i];S.inv[c.id]++;fxText(x*TS+8,y*TS,'+1 '+CROPS[c.id].name);const cd=CROPS[c.id];if(cd.regrow){c.d=cd.days-cd.regrow;c.ready=false;}else{S.farm.crop[i]=null;}hint('harvest','とれた作物は出荷箱へ。あげると喜ぶ住人もいるよ');}
    else if(k==='rock'){S.farm.rock[i]=0;S.inv.stone+=2;dust(x*TS+8,y*TS+8,'#9d978a',7);fxText(x*TS+8,y*TS,'+2 石');hint('rock','石は家の改築に使うよ。クロエの工房で相談しよう');}
    else if(k==='flower'){S.farm.flower[i]=0;S.inv.flower++;fxText(x*TS+8,y*TS,'+1 野の花');}
    updHud();

}

  if(tx<0||ty<0||tx>=MW||ty>=MH)return;

  if(S.over)return;

  const lines=[];
  // 出荷
  let pay=0,cnt=0;for(const k in S.ship){pay+=S.ship[k]*CROPS[k].sell;cnt+=S.ship[k];S.ship[k]=0;}
  // 作物
  for(let i=0;i<MW*MH;i++){const c=S.farm.crop[i];if(c&&!c.ready&&S.farm.wet[i]){c.d++;if(c.d>=CROPS[c.id].days)c.ready=true;}S.farm.wet[i]=0;}
  // 改築
  let renoDone=false;if(S.reno.state===1){S.reno.days--;if(S.reno.days<=0){S.reno.state=2;renoDone=true;}}
  // 部屋を見に来る（同居の場面は朝のカードのあと）
  for(const id of['chloe','luu']){const n=S.npc[id];if(n.pending){n.pending=false;n.visit=true;}}
  // 住人の毎日
  for(const id in S.npc){S.npc[id].talked=false;S.npc[id].gifted=false;}
  // 岩と花
  if(S.npc.chloe.live){let k=0;for(let t=0;t<40&&k<2;t++){const x=3+((Math.random()*10)|0),y=9+((Math.random()*11)|0),i=I(x,y);if(!S.farm.rock[i]&&!S.farm.soil[i]&&!S.farm.crop[i]&&!(y<=10&&(x===7||x===8))){S.farm.rock[i]=1;k++;}}fixRocks(S.farm);}
  S.farm.flower.fill(0);{let k=0;for(let t=0;t<60&&k<3;t++){const x=(Math.random()*MW)|0,y=(Math.random()*MH)|0;if(tile('farm',x,y)==='g'&&!(x===3&&y===6)){S.farm.flower[I(x,y)]=1;k++;}}}
  S.day++;S.time=DAY_START;S.stamina=passedOut?Math.round(S.maxSt*.7):S.maxSt;S.map='farm';P.x=3;P.y=6;P.dir=0;
  for(const id in RT){RT[id].hidden=true;RT[id].task=null;RT[id].path=[];RT[id].act=null;}
  if(pay){S.money+=pay;S.stats.earned+=pay;S.stats.shipped+=cnt;lines.push(`出荷のお金 ${pay}G が入った`);}
  if(passedOut)lines.unshift('つかれて眠ってしまった…（体力が少しへった）');
  if(renoDone){lines.push('家の増築ができた！部屋が2つふえた');}
  if(S.npc.luu.live)lines.push('ルゥが畑の水やりをしてくれる');
  if(S.npc.chloe.live)lines.push('クロエが畑の岩をくだいてくれる');
  renderBase('farm');
  if(S.day>SEASON_DAYS){S.over=true;save();return seasonEnd();}
  setFree(null);save();
  await dayCard(lines);
  await runVisits();
  if(S.day===2)hint('map','街へは下の「地図」から。住人と仲よくなろう');
}

/* ---------- 光のしくみ ---------- */
/* ---------- 光のしくみ（WebGL） ----------
   1コマごとに、色(cv)・面の向き・高さ/かげ/つや・影・光る所 の5枚を「画面のドットの大きさ」で描き、
   光の計算は1ドットずつ（軽い）。仕上げ（ぼかし・にじむ光・光の筋・霧・色の調子）だけ画面の大きさで。
   霧と光の筋は「地図の上の位置」で描くので、カメラが動いてもずれない */
const LIGHT_KEY='monmusu-farm-light';
const LIT={q:2,act:false,ok:false,pk:2,dts:[],auto:true};
try{const v=localStorage.getItem(LIGHT_KEY);if(v!==null){LIT.q=Math.max(0,Math.min(3,+v|0));LIT.auto=false;}}catch(e){}
const glc=$('#gl'),pfx=$('#pfx'),pctx=pfx.getContext('2d');
const layer=()=>{const c=document.createElement('canvas');c.width=c.height=1;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return{c,g};};
const LN=layer(),LD=layer(),LS=layer(),LE=layer();
const nctx=LN.g,dctx=LD.g,shg=LS.g,eg=LE.g;
const BASE3={};
// 動く物の「面の向き」：色の絵から1ドットずつ作っておく（kind: flat＝地面・round＝丸い物・body＝人）
const NCACHE=new WeakMap();
function silOf(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,o=new Uint8ClampedArray(w*h*4);for(let i=0;i<w*h;i++)if(d[i*4+3]>=160)o[i*4+3]=255;return bufCanvas(w,h,o);}
function sprN(src,kind){if(src.nd)return src.nd;let o=NCACHE.get(src);if(o)return o;
  const w=src.width,h=src.height,cd=src.getContext('2d').getImageData(0,0,w,h).data;
  const n=new Uint8ClampedArray(w*h*4),d=new Uint8ClampedArray(w*h*4);
  let x0=w,x1=-1,y0=h,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(cd[(y*w+x)*4+3]>=160){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  const cxm=(x0+x1+1)/2,cym=(y0+y1+1)/2,rx=Math.max(1,(x1-x0+1)/2),ry=Math.max(1,(y1-y0+1)/2);
  const put=(i,N,z,ao,spec)=>{const l=Math.hypot(N[0],N[1],N[2])||1;n[i*4]=(N[0]/l*.5+.5)*255;n[i*4+1]=(N[1]/l*.5+.5)*255;n[i*4+2]=(N[2]/l*.5+.5)*255;n[i*4+3]=255;
    d[i*4]=Math.max(0,Math.min(255,z*3));d[i*4+1]=ao*255;d[i*4+2]=spec*255;d[i*4+3]=255;};
  for(let y=0;y<h;y++){let a0=w,a1=-1;for(let x=0;x<w;x++)if(cd[(y*w+x)*4+3]>=160){if(x<a0)a0=x;a1=x;}
    for(let x=0;x<w;x++){const i=y*w+x;if(cd[i*4+3]<160)continue;
      if(kind==='flat')put(i,NU,0,1,0);
      else if(kind==='round')put(i,sphereN((x+.5-cxm)/rx*.85,(y+.5-cym)/ry*.85),(y1+1-y)*.8,1,.06);
      else{const u=(x+.5-(a0+a1+1)/2)/Math.max(1.5,(a1-a0+1)/2),top=Math.max(0,1-(y-y0)/4);
        put(i,[u*.8,Math.sqrt(Math.max(0,1-u*u*.64))*(1-top*.55),.22+top*.85],y1+1-y,1,.08);}}}
  const nn=bumpLum(cd,n,d,w,h,kind==='flat'?2.2:1.1);
  o={n:bufCanvas(w,h,nn),d:bufCanvas(w,h,d),sil:silOf(src),by:y1+1};NCACHE.set(src,o);return o;}
// 色と面の向きを同じ所に重ねて描く
function blit3(src,kind,X,Y){ctx.drawImage(src,X,Y);if(!LIT.act)return null;const o=sprN(src,kind);nctx.drawImage(o.n,X,Y);dctx.drawImage(o.d,X,Y);if(src.em)eg.drawImage(src.em,X,Y);return o;}

}
function upT(t,src){gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);}

// 画質：3＝高（画面のこまかさまで）・2＝中・1＝低（ドットの大きさのまま）・0＝なし
const LQ_NAME=['なし','低','中','高'];
function applyLight(){
  const on=LIT.ok&&LIT.q>0&&!!G;
  glc.hidden=pfx.hidden=!on;cv.style.opacity=on?'0':'1';
  const b=$('#lightBtn');if(b){b.textContent='光 '+LQ_NAME[on?LIT.q:0];b.hidden=!LIT.ok;}
  if(!on)return;
  const dpr=Math.min(window.devicePixelRatio||1,2),k=LIT.q===3?view.sc*dpr:LIT.q===2?view.sc:1;
  glc.width=Math.round(view.w*k);glc.height=Math.round(view.h*k);
  const kp=Math.min(k,view.sc);pfx.width=Math.round(view.w*kp);pfx.height=Math.round(view.h*kp);LIT.pk=kp;
  for(const c of[glc,pfx]){c.style.width=view.w*view.sc+'px';c.style.height=view.h*view.sc+'px';}
}
function resizeLayers(){for(const L of[LN,LD,LS,LE]){L.c.width=view.w;L.c.height=view.h;L.g.imageSmoothingEnabled=false;}applyLight();}
// 重いときは1段かるくする（自分でえらんだときはそのまま）
function watchSpeed(raw){if(!LIT.act||!LIT.auto||LIT.q<=1||!started)return;if(raw>.2)return;
  LIT.dts.push(raw);if(LIT.dts.length<150)return;const avg=LIT.dts.reduce((a,b)=>a+b,0)/LIT.dts.length;LIT.dts.length=0;
  LIT.slow=avg>.028?(LIT.slow||0)+1:0;if(LIT.slow>=2){LIT.q--;LIT.auto=false;applyLight();toast('光をすこし軽くしたよ（上の「光」で変えられる）');}}

/* ---- つぶ（花びら・光のちり・ほたる）。地図の上の位置で動く ---- */
const LP=[];const LP_COUNT={petal:7,mote:14,fly:9};
function lpSpawn(kind,cx,cy,init){const p={kind,t:0,ph:Math.random()*6.28},W=view.w,H=view.h;
  if(kind==='petal'){p.x=cx+(init?Math.random()*W:W+4+Math.random()*20);p.y=cy+(init?Math.random()*H:-10+Math.random()*H*.4);p.vx=-(5+Math.random()*9);p.vy=6+Math.random()*7;p.rot=Math.random()*6.28;p.spin=(Math.random()-.5)*5;p.s=.9+Math.random()*.5;}
  else if(kind==='mote'){p.x=cx+Math.random()*W;p.y=cy+Math.random()*H*.85;p.vx=(Math.random()-.5)*2;p.vy=-(1+Math.random()*2);p.life=5+Math.random()*5;p.s=.5+Math.random()*.7;}
  else{p.x=cx+Math.random()*W;p.y=cy+Math.random()*H;p.seed=Math.random()*100;}
  LP.push(p);}
function drawLP(dt,t,P,cx,cy){
  const k=LIT.pk;pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,pfx.width,pfx.height);
  const mul=LIT.q===1?.5:1,W=view.w,H=view.h;
  const tint=P.sunCol.map((v,i)=>Math.min(1,v*.8+P.sky[i]*1.2+.15));
  for(const kind in LP_COUNT){let n=0;for(const p of LP)if(p.kind===kind)n++;
    const want=Math.round(LP_COUNT[kind]*mul*(kind==='fly'?P.night:kind==='mote'?Math.min(1,P.ray*1.2+.1):1));for(let i=n;i<want;i++)lpSpawn(kind,cx,cy,true);}
  for(let i=LP.length-1;i>=0;i--){const p=LP[i];p.t+=dt;
    const out=p.x<cx-30||p.x>cx+W+40||p.y<cy-40||p.y>cy+H+30;
    if(p.kind==='petal'){p.x+=(p.vx+Math.sin(t*1.7+p.ph)*4)*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;if(out){LP.splice(i,1);continue;}
      const s=p.s*k,a=.85*(.4+.6*Math.min(1,P.sunAmt+.25));
      pctx.save();pctx.translate((p.x-cx)*k,(p.y-cy)*k);pctx.rotate(p.rot);pctx.scale(1,.25+.75*Math.abs(Math.cos(p.rot*1.3+p.ph)));
      pctx.globalAlpha=a;pctx.fillStyle=`rgb(${255*tint[0]|0},${205*tint[1]|0},${218*tint[2]|0})`;
      pctx.beginPath();pctx.ellipse(0,0,s*1.3,s*.8,0,0,6.283);pctx.fill();pctx.restore();}
    else if(p.kind==='mote'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t>p.life||out){LP.splice(i,1);continue;}
      const a=Math.sin(p.t/p.life*Math.PI)*(.4+.6*Math.sin(t*3+p.ph)**2)*Math.min(1,P.ray*1.3)*.8,r=p.s*k*1.6;if(a<.02)continue;

}
function openShip(){
  return new Promise(res=>{openPanel('出荷箱',()=>{let v=0;for(const k in S.ship)v+=S.ship[k]*CROPS[k].sell;return v?`あしたの朝 ${v}G`:'入れたものは次の朝にお金になる';},(list,re)=>{
    let any=false;
    for(const k in CROPS){if(!S.inv[k])continue;any=true;const c=CROPS[k];
      row(list,ICON[k],`${c.name}　×${S.inv[k]}`,`1つ ${c.sell}G`,[{t:'1つ',f:()=>{S.inv[k]--;S.ship[k]++;re();}},{t:'全部',sub:true,f:()=>{S.ship[k]+=S.inv[k];S.inv[k]=0;re();}}]);}
    if(!any){const n=document.createElement('p');n.className='note';n.textContent='出荷できる作物を持っていないよ。畑で育てて収穫しよう';list.appendChild(n);}
  },res);});
}
function openBag(){
  openPanel('かばん','',(list)=>{
    for(const k in TOOLS){const lv=(S.tools&&S.tools[k])||1;row(list,HICON[k],`${TOOLS[k].name}　${TOOL_LV[lv]||'Lv'+lv}`,'下の道具の列でえらんで使う。あとで強くできる（次の試作から）');}
    for(const k in ITEM_NAMES){if(!S.inv[k])continue;row(list,ICON[k],`${ITEM_NAMES[k]}　×${S.inv[k]}`,k==='stone'?'改築の材料（クロエの工房）':k==='flower'?'畑のまわりに毎朝さく':'出荷するか、住人にあげよう');}
    for(const k in CROPS){if(!S.seeds[k])continue;row(list,ICON[k],`${CROPS[k].name}の種　×${S.seeds[k]}`,'畑にまく');}
    if(!list.children.length){const n=document.createElement('p');n.className='note';n.textContent='からっぽ';list.appendChild(n);}
  });
}
function pickItem(title){
  return new Promise(res=>{let chosen=null;const close=openPanel(title,'',(list)=>{
    let any=false;for(const k in ITEM_NAMES){if(!S.inv[k])continue;any=true;row(list,ICON[k],`${ITEM_NAMES[k]}　×${S.inv[k]}`,'',[{t:'あげる',f:()=>{chosen=k;close();}}]);}
    if(!any){const n=document.createElement('p');n.className='note';n.textContent='あげられる物を持っていないよ。作物・石・野の花をあげられる';list.appendChild(n);}
  },()=>res(chosen));});
}
function openMap(){
  const go=(k,label)=>({t:'行く',f:async()=>{close();const[m,x,y]=SPOTS[k];await warp(m,x,y);toast(label);}});
  const close=openPanel('地図','行きたい所をタップ',(list)=>{
    row(list,null,'牧場','わたしの家・畑・出荷箱',[go('farmHome','牧場')]);
    row(list,null,'街の広場','噴水のまわり。ルゥがよく遊んでいる',[go('town','街の広場')]);
    row(list,null,'クロエの工房','改築の相談はここ（8時〜18時）',[go('workshop','クロエの工房')]);
    row(list,null,shopTitle(),'春の種を売っている（9時〜17時）',[go('shop','種屋')]);
  });
}
function openFriends(){
  const close=openPanel('なかよし','',(list)=>{
    for(const id of['chloe','luu']){const n=S.npc[id],d=DLG[id];const h=hearts(id);
      const st=n.live?'牧場で一緒に暮らしている':n.pending?'あしたの朝 部屋を見に来る':n.visit?'けさ 部屋を見に来る':!n.met?'まだ会っていない':h>=INVITE_HEARTS?'一緒に住もうと誘えそう':`♥${INVITE_HEARTS}になったら誘える`;
      const r=row(list,null,`${d.name}<span class="kind">　${id==='chloe'?'ドラゴン娘':'スライム娘'}</span>`,`<span class="hearts">${'♥'.repeat(h)}<i>${'♥'.repeat(MAX_HEARTS-h)}</i></span>　${st}`);
      const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d');const sp=SPR[id][0][0];g.drawImage(sp,sp.ox||0,(SPR[id].faceY||0)+(sp.oy||0),16,16,0,1,16,16);r.replaceChild(c,r.firstChild);}
    const hs=S.reno.state===0?`改築：まだ（クロエに${RENO.cost}Gと石${RENO.stone}個）`:S.reno.state===1?`改築：工事中（あと${S.reno.days}日）`:`改築：完成・部屋 ${S.rooms.filter(Boolean).length}/${RENO.rooms}`;
    const n=document.createElement('p');n.className='note';n.innerHTML=`${hs}<br>話す（1日1回）と贈り物（1日1回）で仲よくなれる。${OTHERS.length?`<br>ほかの住人：${OTHERS.join('・')}（次の試作から）`:''}`;list.appendChild(n);
    const rb=document.createElement('button');rb.className='pbtn sub';rb.style.marginTop='8px';rb.textContent='最初からやり直す';let armed=false;
    rb.onclick=()=>{if(!armed){armed=true;rb.textContent='もう一度押すと、データを消して最初から';return;}clearSave();location.reload();};list.appendChild(rb);
  });
}
async function warp(m,x,y){
  Q.length=0;P.path=[];P.task=null;fading=true;const f=$('#fade');f.innerHTML='';f.classList.add('on');await wait(350);
  S.map=m;P.x=x;P.y=y;P.dir=0;setFree(null);await wait(120);f.classList.remove('on');await wait(300);fading=false;
  if(m==='town')hint('town','クロエは工房、ルゥは噴水のまわりにいるよ。タップで話せる');
}
async function dayCard(lines){
  fading=true;const f=$('#fade');f.innerHTML=`<div class="d">春 ${S.day}日（${DOW[(S.day-1)%7]}）</div><div class="l">${lines.join('<br>')}</div>`;f.classList.add('on');
  updHud();await wait(lines.length?1700+lines.length*500:1100);f.classList.remove('on');await wait(350);fading=false;
}
function seasonEnd(){
  const live=['chloe','luu'].filter(id=>S.npc[id].live).map(id=>DLG[id].name);
  modalOpen=true;M.wrap.hidden=false;
  M.panel.innerHTML=`<h2>春がおわった<small>試作1はここまで</small></h2><div class="plist">
  <div class="row"><span></span><div class="t"><div>出荷で ${S.stats.earned}G かせいだ</div><div>出荷した作物 ${S.stats.shipped}こ</div></div></div>
  <div class="row"><span></span><div class="t"><div>一緒に暮らす仲間：${live.length?live.join('・'):'まだいない'}</div><div>クロエ ♥${hearts('chloe')}・ルゥ ♥${hearts('luu')}</div></div></div></div>`;
  const b=document.createElement('button');b.className='close';b.textContent='もう一度 春から';b.onclick=()=>{clearSave();location.reload();};M.panel.appendChild(b);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- ループ ---------- */
let started=false,ff=1,last=performance.now(),saveT=0;
function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.add('off');}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=marks.length-1;i>=0;i--){marks[i].t-=dt;if(marks[i].t<=0)marks.splice(i,1);}
  if(busy())return;
  S.time+=dt*GMIN_PER_SEC*ff;
  if(S.time>=DAY_END){passOut();return;}
  if(S.time>=1320&&!S.flags['late'+S.day]){S.flags['late'+S.day]=1;toast('もう22時。そろそろ家に帰って寝よう');}
  updPlayer(dt);
  for(const id in RT)updNpc(id,dt);
  updClock();
  if((saveT+=dt)>20){saveT=0;save();}
}
function loop(now){const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;if(S)update(dt);const t0=performance.now();render();LIT.ms=(LIT.ms||0)*.95+(performance.now()-t0)*.05;watchSpeed(raw);LIT.fr=(LIT.fr||[]).slice(-59);LIT.fr.push(raw);requestAnimationFrame(loop);}

/* ---------- はじまり ---------- */
function initRT(){for(const id of['chloe','luu','shop']){RT[id]={map:'town',x:0,y:0,path:[],dir:0,anim:0,act:null,task:null,hidden:true,speed:id==='luu'?3.2:2.8,wait:0,idle:0,bub:0};}}
async function begin(fresh){
  $('#title').hidden=true;
  if(fresh){clearSave();S=newState();}
  if(!S.hand)S.hand='hoe';if(!S.tools)S.tools={hoe:1,can:1,pick:1};delete S.sel;
  P.x=S.px;P.y=S.py;P.dir=S.dir||0;setFree(null);
  renderBase('farm');renderBase('town');updHud();updClock();started=true;
  if(!S.flags.intro){S.flags.intro=true;
    const intro=DLG.intro&&DLG.intro.length?DLG.intro:[{who:'narr',text:'モン娘だけが暮らす街の、はずれの牧場。'},{who:'player',text:'今日からここが、わたしの牧場。がんばろう！'}];
    await scene(intro);toast('下の道具からクワをえらんで、畑のマスをタップ。指でなぞると見わたせるよ');save();}
  await runVisits();
}
async function boot(){
  LIT.ok=initGL();
  resize();addEventListener('resize',resize);
  $('#lightBtn').onclick=()=>{LIT.q=LIT.q===0?3:LIT.q-1;LIT.auto=false;try{localStorage.setItem(LIGHT_KEY,String(LIT.q));}catch(e){}applyLight();};
  await loadDLG();
  ['player','chloe','luu','shop'].forEach(makeSprites);
  OTHERS=(DLG.others||[]).map(o=>o.name||o);
  initRT();
  // タイトルの絵
  const tg=$('#tcv').getContext('2d');tg.imageSmoothingEnabled=false;
  for(let x=0;x<6;x++)drawGrass(tg,x,2);const T=(sp,x,y)=>tg.drawImage(sp,x-(sp.ox||0),y-(sp.oy||0));T(SPR.chloe[0][0],20,14);T(SPR.player[0][0],40,14);T(SPR.luu[0][0],60,14);
  drawCrop(tg,'kabu',3,4,28);drawCrop(tg,'ichigo',3,78,28);
  const sv=loadSave();if(sv){S=sv;$('#contBtn').hidden=false;}
  $('#newBtn').onclick=()=>begin(true);$('#contBtn').onclick=()=>begin(false);
  cv.addEventListener('pointerdown',e=>{if(ptr||!e.isPrimary)return;const b=cv.getBoundingClientRect();
    ptr={id:e.pointerId,sx:e.clientX,sy:e.clientY,bx:b.left,by:b.top,drag:false,cx:cam.x,cy:cam.y};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.sx,dy=e.clientY-ptr.sy;
    if(!ptr.drag&&Math.hypot(dx,dy)>10)ptr.drag=true;
    if(ptr.drag&&S&&started){const[x,y]=clampCam(ptr.cx-dx/view.sc,ptr.cy-dy/view.sc);setFree({x,y});}});
  const endPtr=(e,cancel)=>{if(!ptr||e.pointerId!==ptr.id)return;const p=ptr;ptr=null;
    if(p.drag){if(S&&started)hint('pan','もどるときは右下の「自分にもどる」');}else if(!cancel)onTap(p.sx-p.bx,p.sy-p.by);};
  cv.addEventListener('pointerup',e=>endPtr(e,false));cv.addEventListener('pointercancel',e=>endPtr(e,true));
  recBtn.onclick=()=>setFree(null);
  $('#bagBtn').onclick=()=>{if(!busy())openBag();};
  $('#mapBtn').onclick=()=>{if(!busy())openMap();};
  $('#friendBtn').onclick=()=>{if(!busy())openFriends();};
  $('#ffBtn').onclick=e=>{ff=ff===1?8:1;e.currentTarget.setAttribute('aria-pressed',ff>1?'true':'false');e.currentTarget.textContent=ff>1?'早送り×8':'早送り';};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started)save();});
  if(!sv)S=null;
  requestAnimationFrame(loop);
  window.__game={get S(){return S;},P,RT,Q,onTap,sleep,openNpc,view,cam,canAct,LIT,
    ui:{say,choose,openShop,openShip,openBag,openMap,openFriends,bubble},
    fps(){const a=LIT.fr||[];return a.length?Math.round(a.length/a.reduce((x,y)=>x+y,0)):0;},
    debug(o){if(o.time!=null)S.time=o.time;if(o.map)S.map=o.map;if(o.cam&&o.cam[0]>=0)setFree({x:o.cam[0],y:o.cam[1]});if(o.light!=null){LIT.q=o.light;applyLight();}if(o.pos){P.x=o.pos[0];P.y=o.pos[1];P.path=[];}if(o.npc)Object.assign(DBGN,o.npc);if(o.pdir!=null)P.dir=o.pdir;if(o.wear){CHARS.player.wear=o.wear;makeSprites('player');}}};
}
boot();
})();
</script>
