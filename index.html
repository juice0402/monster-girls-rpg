<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>モン娘牧場 試作1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* 縦持ち1画面：上に日付と体力、まん中に地図、下に種・かばん・地図。木の板と紙のふきだし */
:root{
  --ground:#1c2b22;
  --wood:#6b4426;
  --wood-d:#43281a;
  --wood-l:#8f6038;
  --paper:#fbf1da;
  --paper-d:#e9d8b4;
  --ink:#3a2618;
  --leaf:#7cc35e;
  --leaf-d:#4f8f3a;
  --heart:#ff6b8f;
  --sun:#ffd25e;
  --font:'DotGothic16','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ground)}
body{font-family:var(--font);color:var(--paper);overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--ground)}

/* 上の板 */
#hud{flex:none;background:var(--wood);border-bottom:3px solid var(--wood-d);padding:6px max(10px,env(safe-area-inset-left,0px)) 6px max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
#hud .when{display:flex;gap:10px;align-items:baseline;font-size:15px;white-space:nowrap}
#clock{font-size:20px;color:var(--sun);font-variant-numeric:tabular-nums}
#money{justify-self:end;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
#money::after{content:"G";margin-left:2px;color:var(--sun)}
.st{display:flex;align-items:center;gap:6px;font-size:12px}
.st .bar{width:120px;height:10px;background:var(--wood-d);border:2px solid #2c1a10;position:relative}
.st .bar i{position:absolute;inset:0;width:100%;background:var(--leaf);transition:width .2s}
.hudbtns{justify-self:end;display:flex;gap:6px}
.hb{background:var(--wood-d);border:2px solid #2c1a10;padding:3px 8px;font-size:12px;line-height:1.2}
.hb[aria-pressed="true"]{background:var(--sun);color:var(--ink)}

/* まん中 */
#stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#24351f}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-100%);font-size:13px;color:#fff;text-shadow:1px 1px 0 #2c1a10,-1px 1px 0 #2c1a10,1px -1px 0 #2c1a10,-1px -1px 0 #2c1a10;white-space:nowrap;animation:up 1.2s ease-out forwards}
.ft.heart{color:var(--heart)}
.ft.money{color:var(--sun)}
@keyframes up{to{transform:translate(-50%,-180%);opacity:0}}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:3px 7px;font-size:12px;white-space:nowrap;max-width:220px}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(43,26,16,.92);border:2px solid var(--wood-l);padding:6px 12px;font-size:13px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .25s}
#toast.off{opacity:0}

/* 下の板 */
#bar{flex:none;background:var(--wood);border-top:3px solid var(--wood-d);padding:6px max(8px,env(safe-area-inset-left,0px)) 8px max(8px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:stretch}
#hotbar{flex:1;display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
#hotbar::-webkit-scrollbar{display:none}
.slot{flex:none;position:relative;white-space:nowrap;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:52px;padding:4px 3px 3px;background:var(--wood-d);border:2px solid #2c1a10;font-size:10px;line-height:1.1}
.slot img{width:28px;height:28px;image-rendering:pixelated}
.slot b{position:absolute;right:2px;top:1px;font-weight:normal;font-size:10px;font-variant-numeric:tabular-nums;text-shadow:1px 1px 0 #2c1a10}
.slot.empty img{opacity:.4}
.slot[aria-pressed="true"]{background:var(--sun);border-color:#fff6d0;color:var(--ink)}
.slot[aria-pressed="true"] b{text-shadow:none}
.slot.gap{margin-left:6px}
#recenter{position:absolute;right:8px;bottom:8px;z-index:5;background:var(--wood);border:2px solid #2c1a10;color:var(--paper);padding:5px 10px;font-size:13px}
.big{flex:none;min-width:58px;background:var(--wood-l);border:2px solid #2c1a10;font-size:13px;padding:4px 6px}

/* ふきだし */
#dlg{position:absolute;left:8px;right:8px;bottom:8px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);padding:10px 12px 10px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;z-index:20}
#dlg.noface{grid-template-columns:1fr}
#dlg.noface #face{display:none}
#face{width:56px;height:56px;background:#f3e3bf;border:2px solid var(--ink);image-rendering:pixelated;grid-row:span 2}
#dname{font-size:13px;color:var(--leaf-d);align-self:end}
#dtext{font-size:16px;line-height:1.55;min-height:3.1em;grid-column:2;white-space:pre-wrap}
#dlg.noface #dtext,#dlg.noface #dname{grid-column:1}
#dnext{position:absolute;right:10px;bottom:6px;font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#dopts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
#dopts button{flex:1 1 40%;background:var(--paper-d);border:2px solid var(--ink);color:var(--ink);padding:9px 6px;font-size:15px}
#dopts button.primary{background:var(--leaf);}

/* まど */
#modal{position:absolute;inset:0;background:rgba(10,14,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.panel{width:100%;max-height:82%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-top:3px solid var(--ink);padding:12px max(14px,env(safe-area-inset-left,0px)) 14px max(14px,env(safe-area-inset-right,0px))}
.panel h2{margin:0 0 8px;font-size:18px;font-weight:normal;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:13px;color:var(--wood)}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:7px 8px;background:#f3e3bf;border:2px solid var(--paper-d)}
.row img,.row canvas{width:32px;height:32px;image-rendering:pixelated}
.row .t{min-width:0}
.row .t div:first-child{font-size:15px}
.row .t div+div{font-size:12px;color:var(--wood);margin-top:2px}
.row .acts{display:flex;gap:5px}
.pbtn{background:var(--leaf);border:2px solid var(--ink);color:var(--ink);padding:7px 10px;font-size:14px}
.pbtn.sub{background:var(--paper-d)}
.pbtn:disabled{opacity:.4}
.close{margin-top:10px;align-self:stretch;background:var(--paper-d);border:2px solid var(--ink);color:var(--ink);padding:10px;font-size:15px}
.hearts{color:var(--heart);letter-spacing:1px;font-size:13px}
.hearts i{font-style:normal;color:#d9c4a0}
.note{font-size:12px;color:var(--wood);margin:6px 2px 0;line-height:1.5}

#fade{position:absolute;inset:0;background:#0d0d14;opacity:0;pointer-events:none;transition:opacity .35s;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#fade.on{opacity:1;pointer-events:auto}
#fade .d{font-size:24px;color:var(--sun)}
#fade .l{font-size:15px;line-height:1.7}

#title{position:absolute;inset:0;z-index:50;background:linear-gradient(#7fc4e8 0 38%,#9ed37c 38% 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink);padding:24px}
#title canvas{width:288px;height:144px;image-rendering:pixelated;max-width:100%}
#title h1{margin:0;font-size:30px;font-weight:normal;letter-spacing:2px;text-shadow:2px 2px 0 var(--paper)}
#title p{margin:0;font-size:13px}
#title .tb{display:flex;flex-direction:column;gap:8px;width:220px}
#title button{background:var(--paper);border:3px solid var(--ink);color:var(--ink);padding:10px;font-size:17px}
#title button.go{background:var(--leaf)}
@media (prefers-reduced-motion:reduce){.ft{animation-duration:.01s}#fade{transition:none}#dnext{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="when"><span id="date">春 1日（月）</span><span id="clock">6:00</span></div>
    <div id="money">300</div>
    <div class="st"><span>体力</span><span class="bar"><i id="stbar"></i></span></div>
    <div class="hudbtns">
      <button class="hb" id="ffBtn" aria-pressed="false">早送り</button>
      <button class="hb" id="friendBtn">なかよし</button>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="fx"></div>
    <div id="toast" class="off"></div>
    <button id="recenter" hidden>自分にもどる</button>
    <div id="dlg" hidden>
      <canvas id="face" width="16" height="16"></canvas>
      <div id="dname"></div>
      <div id="dtext"></div>
      <div id="dopts" hidden></div>
      <div id="dnext" hidden>▼</div>
    </div>
  </main>
  <footer id="bar">
    <div id="hotbar"></div>
    <button class="big" id="bagBtn">かばん</button>
    <button class="big" id="mapBtn">地図</button>
  </footer>
  <div id="modal" hidden><div class="panel" id="panel"></div></div>
  <div id="fade"></div>
  <div id="title">
    <canvas id="tcv" width="96" height="48"></canvas>
    <h1>モン娘×牧場</h1>
    <p>試作1　春の28日</p>
    <div class="tb">
      <button class="go" id="contBtn" hidden>つづきから</button>
      <button id="newBtn">はじめから</button>
    </div>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TS=16, MW=16, MH=24;
const DOW=['月','火','水','木','金','土','日'];
const GMIN_PER_SEC=10/7;            // ゲームの10分＝7秒
const DAY_START=360, DAY_END=1560;  // 6:00〜26:00(2:00)
const SEASON_DAYS=28;
const CROPS={
  kabu:{name:'カブ',seed:20,days:4,sell:45,regrow:0},

const ITEM_NAMES={kabu:'カブ',jaga:'ジャガイモ',ichigo:'イチゴ',stone:'石',flower:'野の花'};
const RENO={cost:1500,stone:30,days:2,rooms:2};
const HEART=100, INVITE_HEARTS=4, MAX_HEARTS=10;

// 道具（レベルは S.tools。あとで強くできるように、いまは全部1）
const TOOLS={hoe:{name:'クワ'},can:{name:'じょうろ'},pick:{name:'ハンマー'}};
const TOOL_LV=['','ふつう'];

const SAVE_KEY='monmusu-farm-proto1';
const DIRS=[[0,1],[0,-1],[-1,0],[1,0]];

/* ---------- 地図 ---------- */
const MAPS={
farm:{name:'牧場',rows:[
'TTTTTTTTTTTTTTTT',

'TgFFFFFFFFFFFFgT',
'TggggggggggwwwgT',
'TggggggggggwwwgT',
'TTTTTTTTTTTTTTTT']},
town:{name:'街',rows:[

'TWWWWWggggSSSSST',

'TWWWWWggggSSSSST',
'TWWWWWggggSSSSST',
'TggpgkggggggpggT',
'TggssssssssssggT',
'TggssssssssssggT',
'TggsbssssssbsggT',
'TggssssOOssssggT',
'TggssssOOssssggT',
'TggssssssssssggT',
'TggssssssssssggT',

'TggssssssssssggT',
'TggggpggggpggggT',
'TaaaapLLLLpccccT',
'TaaaapLLLLpccccT',
'TaaaapLLLLpccccT',
'TaaaapLLLLpccccT',
'TgppppppppppppgT',
'TggggggggggggggT',
'TTTTTTTTTTTTTTTT']},
};
const BLOCK=new Set(['T','H','X','F','w','W','S','O','b','k','a','L','c']);
function tile(m,x,y){if(x<0||y<0||x>=MW||y>=MH)return 'T';return MAPS[m].rows[y][x];}
const I=(x,y)=>y*MW+x;
function blocked(m,x,y){
  const t=tile(m,x,y);
  if(t==='A')return S.reno.state>0;
  if(BLOCK.has(t))return true;
  if(m==='farm'&&S.farm.rock[I(x,y)])return true;
  return false;
}
const SPOTS={
  farmHome:['farm',3,6],town:['town',7,14],workshop:['town',3,6],shop:['town',12,6],
};

/* ---------- 台詞（data/dialogue.json を読みこむ。読めないときの最小版） ---------- */
let DLG={
  player:{name:'わたし'},
  chloe:{name:'クロエ',meet:['…はじめまして。クロエ。工房をやってる。'],daily:{0:['…何か用？'],2:['畑、見たよ。'],4:['今日も来たんだ。…悪くない。']},giftPrefs:{love:['石'],like:['ジャガイモ'],dislike:[]},gift:{love:'…いい石。ありがとう。',like:'もらっておく。',normal:'…どうも。',dislike:'これは…いらない。',already:'今日はもうもらった。'},invite:{lowHearts:'…まだ、そこまでじゃない。',noRoom:'部屋がないでしょ。'},cohabit:[{who:'chloe',text:'…わかった。明日、行く。'}],farm:['岩は任せて。'],work:['…ふっ。'],reno:{offer:'改築なら{cost}Gと石{stone}個。',short:'足りない。',ordered:'受けた。2日でやる。',working:'いま工事中。',done:'できたよ。'}},
  luu:{name:'ルゥ',meet:['はじめまして！ルゥだよ！'],daily:{0:['やっほー！'],2:['また来てくれた！'],4:['だいすきー！']},giftPrefs:{love:['イチゴ'],like:['野の花'],dislike:['石']},gift:{love:'わーい！',like:'ありがと！',normal:'えへへ',dislike:'かたーい…',already:'今日はもうもらったよ！'},invite:{lowHearts:'えっ、まだはずかしいよ〜',noRoom:'お部屋、ある？'},cohabit:[{who:'luu',text:'いっしょに住む！'}],farm:['お水あげたよ！'],work:['ぴゅー！'],},
  shop:{name:'種屋さん',species:'',greet:['いらっしゃい。'],bought:'まいど。',noMoney:'お金が足りないよ。'},
  banter:[[{who:'chloe',text:'…ぬれてる。'},{who:'luu',text:'えへへ、スライムだもん！'}]],
};
async function loadDLG(){
  try{const r=await fetch('data/dialogue.json',{cache:'no-store'});if(r.ok){const j=await r.json();DLG=Object.assign(DLG,j);}}catch(e){}
}

/* ---------- 見た目（コードで描くドット絵・C） ---------- */
const LOOKS={
  player:{skin:'#f6d3b8',hair:'#8a4b2a',hairD:'#6a3820',hairL:'#b06a3c',eye:'#5a3a2a',eyeD:'#2a1a14',top:'#d9603b',topD:'#a8452a',sleeve:'#d9603b',bottom:'#5f7d3a',bottomD:'#465e2a',skirt:true,legs:'#f6d3b8',shoe:'#6b4426',hat:{c:'#e3bd62',d:'#b8923e',band:'#c0392b'}},
  chloe:{skin:'#f2d4c4',hair:'#3e2558',hairD:'#2e1b42',hairL:'#5f3f86',eye:'#e0a526',eyeD:'#3a2214',top:'#ece0c6',topD:'#cbbd9c',sleeve:'#ece0c6',bottom:'#4a4054',bottomD:'#363040',legs:'#4a4054',shoe:'#2a2024',longHair:true,horns:'#efe2c4',wings:'#5b3a8c',wingsD:'#43296a',tail:'#5b3a8c',apron:{c:'#8b5a2b',d:'#6a4220'},gloves:'#6b4423'},
  luu:{skin:'#9adb6e',hair:'#6cbf4a',hairD:'#58a63a',hairL:'#c7f2a6',eye:'#2f5a2a',eyeD:'#1c3418',top:'#9adb6e',topD:'#86c75c',sleeve:'#9adb6e',bottom:'#4a6fa5',bottomD:'#3a5785',legs:'#4a6fa5',shoe:'#f2c230',slime:true,overalls:{c:'#4a6fa5',d:'#3a5785'},blush:'#f7a6a6'},
  shop:{skin:'#f6dccb',hair:'#f2b3c6',hairD:'#d98fa8',hairL:'#ffdbe5',eye:'#4f8a3a',eyeD:'#22301a',top:'#f1e6cc',topD:'#d7c9a6',sleeve:'#f1e6cc',bottom:'#f1e6cc',bottomD:'#d7c9a6',skirt:true,legs:'#8d8a4e',shoe:'#6f6a38',longHair:true,apron:{c:'#3f6e45',d:'#2f5535'},flower:'#ff8fb8',leaves:'#5fae58'},
};
function drawChibi(g,L,dir,fr){
  const r=(x,y,w,h,c)=>{if(!c)return;g.fillStyle=c;g.fillRect(x,y,w,h);};
  const side=dir>=2, back=dir===1, act=fr===3;
  const l1=fr===1?1:0, l2=fr===2?1:0;
  // うしろ：翼・しっぽ・長い髪
  if(L.wings){
    if(back){r(1,11,4,5,L.wings);r(11,11,4,5,L.wings);r(0,12,1,3,L.wingsD);r(15,12,1,3,L.wingsD);r(2,15,2,1,L.wingsD);r(12,15,2,1,L.wingsD);}
    else if(side){r(1,11,4,4,L.wings);r(0,12,1,2,L.wingsD);r(2,14,2,1,L.wingsD);}
    else{r(1,12,2,3,L.wings);r(13,12,2,3,L.wings);r(0,13,1,1,L.wingsD);r(15,13,1,1,L.wingsD);}
  }
  if(L.tail){
    if(back){r(7,18,2,3,L.tail);r(8,21,4,1,L.tail);r(11,20,2,1,L.wingsD);}
    else if(side){r(1,18,4,2,L.tail);r(0,17,1,2,L.wingsD);}
    else{r(12,18,3,2,L.tail);r(14,17,1,1,L.wingsD);}
  }
  if(L.longHair&&!back){if(side)r(3,9,5,8,L.hairD);else r(3,9,10,7,L.hairD);}
  // 足
  const legC=L.legs||L.skin;
  if(side){
    r(6,19,2,3-l1,legC);r(6,22-l1,2,2,L.shoe);
    r(8,19,2,3-l2,legC);r(8,22-l2,2,2,L.shoe);
  }else{
    r(5,19,2,3-l1,legC);r(5,22-l1,2,2,L.shoe);
    r(9,19,2,3-l2,legC);r(9,22-l2,2,2,L.shoe);
  }
  // 腰から下
  if(L.skirt){if(side){r(5,16,6,3,L.bottom);r(4,18,7,1,L.bottomD);}else{r(4,16,8,2,L.bottom);r(3,18,10,1,L.bottom);r(3,19,10,1,L.bottomD);}}
  else{if(side)r(5,16,6,3,L.bottom);else r(4,16,8,3,L.bottom);}
  // 胴
  if(side){r(5,12,6,4,L.top);r(5,15,6,1,L.topD);}
  else{r(4,12,8,4,L.top);r(4,15,8,1,L.topD);}
  if(!back)r(7,11,2,1,L.skin);

// 畑のどのマスにも歩いて行けるように、道をふさぐ岩を間引く
function fixRocks(F){
  const open=(x,y)=>{const t=tile('farm',x,y);return !(BLOCK.has(t)||t==='A')&&!F.rock[I(x,y)];};
  for(let guard=0;guard<80;guard++){
    const seen=new Uint8Array(MW*MH);const q=[I(7,8)];seen[q[0]]=1;
    while(q.length){const c=q.pop();const cx=c%MW,cy=(c/MW)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy,ni=I(nx,ny);if(!seen[ni]&&open(nx,ny)){seen[ni]=1;q.push(ni);}}}
    let bad=-1;for(let y=9;y<=19&&bad<0;y++)for(let x=3;x<=12;x++){const i=I(x,y);if(!F.rock[i]&&!seen[i]){bad=i;break;}}
    if(bad<0)return;
    // ふさがれた場所のまわりの岩を1つどける（外とつながる岩を優先）
    const reg=new Uint8Array(MW*MH);const st=[bad];reg[bad]=1;const rocks=[];
    while(st.length){const c=st.pop();const cx=c%MW,cy=(c/MW)|0;for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy,ni=I(nx,ny);if(reg[ni])continue;if(F.rock[ni]){reg[ni]=1;rocks.push(ni);}else if(open(nx,ny)){reg[ni]=1;st.push(ni);}}}
    const good=rocks.find(ri=>DIRS.some(([dx,dy])=>seen[I(ri%MW+dx,((ri/MW)|0)+dy)]));
    F.rock[good!=null?good:rocks[0]]=0;
    if(!rocks.length)return;
  }
}

const P={x:3,y:6,path:[],dir:0,speed:5,anim:0,act:null,task:null,tries:0};
const RT={};
const Q=[];
function moveAlong(e,dt,speed){
  if(!e.path.length)return false;
  const [tx,ty]=e.path[0];const dx=tx-e.x,dy=ty-e.y;const d=Math.hypot(dx,dy);const step=speed*dt;
  if(Math.abs(dx)>Math.abs(dy))e.dir=dx>0?3:2;else if(dy!==0)e.dir=dy>0?0:1;
  if(step>=d){e.x=tx;e.y=ty;e.path.shift();}else{e.x+=dx/d*step;e.y+=dy/d*step;}
  e.anim+=dt;return true;
}
function bfs(m,sx,sy,isGoal){
  const prev=new Int16Array(MW*MH).fill(-1),seen=new Uint8Array(MW*MH);const st=I(sx,sy);const q=[st];seen[st]=1;let h=0;
  while(h<q.length){const c=q[h++];const cx=c%MW,cy=(c/MW)|0;
    if(isGoal(cx,cy)){const path=[];let k=c;while(k!==st){path.push([k%MW,(k/MW)|0]);k=prev[k];}return{path:path.reverse(),end:[cx,cy]};}
    for(const[dx,dy]of DIRS){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const ni=I(nx,ny);if(seen[ni]||blocked(m,nx,ny))continue;seen[ni]=1;prev[ni]=c;q.push(ni);}
  }
  return null;
}
const near=(ax,ay,bx,by,d)=>Math.abs(ax-bx)+Math.abs(ay-by)<=d;
function faceTo(e,tx,ty){const dx=tx-e.x,dy=ty-e.y;if(Math.abs(dx)>Math.abs(dy))e.dir=dx>0?3:2;else if(dy!==0)e.dir=dy>0?0:1;}

function spawnFor(id,sc){

function randTile(m,a){for(let k=0;k<20;k++){const x=a[0]+((Math.random()*(a[2]-a[0]+1))|0),y=a[1]+((Math.random()*(a[3]-a[1]+1))|0);if(!blocked(m,x,y))return[x,y];}return null;}
function npcPath(r,goal){const res=bfs(r.map,Math.round(r.x),Math.round(r.y),goal);if(res){r.path=res.path;return res;}return null;}
function updNpc(id,dt){
  const r=RT[id],sc=schedule(id);
  if(sc.hidden){r.hidden=true;r.path=[];r.task=null;r.act=null;return;}
  if(r.hidden||r.map!==sc.map){r.hidden=false;r.map=sc.map;const sp=spawnFor(id,sc);r.x=sp[0];r.y=sp[1];r.path=[];r.task=null;r.act=null;}
  if(r.bub>0)r.bub-=dt;
  if(r.wait>0){r.wait-=dt;if(r.path.length>1)r.path=r.path.slice(0,1);moveAlong(r,dt,r.speed);return;}
  if(r.act){r.act.t+=dt;if(r.act.t>=r.act.dur){const a=r.act;r.act=null;a.done&&a.done();}return;}
  if(moveAlong(r,dt,r.speed))return;
  r.idle=(r.idle||0)-dt;
  const m=sc.mode;
  if(m==='idle'||m==='build'){
    if(r.x!==sc.x||r.y!==sc.y){if(!npcPath(r,(x,y)=>x===sc.x&&y===sc.y)){r.x=sc.x;r.y=sc.y;}return;}
    if(m==='build'){r.dir=1;if(r.idle<=0){r.idle=.7;r.act={t:0,dur:.35,done:()=>dust(10*TS,5*TS+8,'#c8925a',4)};}}
    else{r.dir=0;if(sc.anim&&r.idle<=0){r.idle=2+Math.random()*3;r.dir=3;r.act={t:0,dur:.4,done:()=>dust(5*TS+8,6*TS+6,'#ffb347',3)};}}
    return;
  }
  if(m==='wander'){if(r.idle<=0){const t=randTile(r.map,sc.area);if(t)npcPath(r,(x,y)=>x===t[0]&&y===t[1]);r.idle=2+Math.random()*4;}return;}
  if(m==='rocks'||m==='water'){
    const isT=m==='rocks'?(x,y)=>S.farm.rock[I(x,y)]===1:(x,y)=>{const c=S.farm.crop[I(x,y)];return c&&!c.ready&&!S.farm.wet[I(x,y)];};
    if(r.task){const[tx,ty]=r.task;
      if(!isT(tx,ty)){r.task=null;return;}
      faceTo(r,tx,ty);
      if(m==='rocks'){r.hits=(r.hits||0)+1;r.act={t:0,dur:.45,done:()=>{dust(tx*TS+8,ty*TS+8,'#9d978a',5);
        if(r.hits>=3){r.hits=0;r.task=null;S.farm.rock[I(tx,ty)]=0;S.inv.stone+=2;fxText(tx*TS+8,ty*TS,'+2 石');if(Math.random()<.35)bubble(id,pick(DLG.chloe.work));}}};}
      else{r.act={t:0,dur:.5,done:()=>{splash(tx*TS+8,ty*TS+8);S.farm.wet[I(tx,ty)]=1;r.task=null;if(Math.random()<.15)bubble(id,pick(DLG.luu.work));}};}
      return;
    }
    if(r.idle>0)return;
    const res=bfs(r.map,Math.round(r.x),Math.round(r.y),(x,y)=>{for(const[dx,dy]of DIRS)if(isT(x+dx,y+dy))return true;return m==='water'&&isT(x,y);});
    if(res){r.path=res.path;const[ex,ey]=res.end;if(m==='water'&&isT(ex,ey))r.task=[ex,ey];else for(const[dx,dy]of DIRS)if(isT(ex+dx,ey+dy)){r.task=[ex+dx,ey+dy];break;}}
    else{const t=randTile(r.map,m==='rocks'?[4,6,14,7]:[8,21,10,22]);if(t)npcPath(r,(x,y)=>x===t[0]&&y===t[1]);r.idle=3+Math.random()*4;}
  }
}

/* ---------- プレイヤーの作業 ---------- */
// 手に持っている物（item）でこのマスに何ができるか。文字列＝できる作業、{need}／{done}＝できない理由、null＝作業なし（歩く）
function canAct(x,y,item){
  if(S.map!=='farm')return null;const i=I(x,y),t=tile('farm',x,y);item=item||S.hand;
  if(S.farm.rock[i])return item==='pick'?'rock':{need:'岩はハンマーでくだこう'};
  if(S.farm.flower[i])return'flower';
  if(t!=='f')return null;
  const soil=S.farm.soil[i],c=S.farm.crop[i],wet=S.farm.wet[i];
  if(c&&c.ready)return'harvest';
  if(item==='hoe'&&!soil)return'till';
  if(item==='can'&&soil)return wet?{done:'ここは今日もう水をやったよ'}:'water';
  if(CROPS[item]&&soil&&!c)return S.seeds[item]>0?'plant':{need:`${CROPS[item].name}の種がない。街の種屋で買えるよ`};
  const need=!soil?'耕すならクワに持ちかえてね':!c?'種をえらぶと、ここにまけるよ':!wet?'水やりはじょうろに持ちかえてね':null;
  return need?{need}:null;
}
function queueField(x,y){
  const k=canAct(x,y,S.hand);
  if(!k)return false;
  if(typeof k==='object'){toast(k.need||k.done);return true;}
  if(Q.some(t=>t.kind==='field'&&t.x===x&&t.y===y)||(P.task&&P.task.kind==='field'&&P.task.x===x&&P.task.y===y))return true;
  if(Q.length>=12){toast('予約は12マスまで');return true;}
  Q.push({kind:'field',x,y,item:S.hand});return true;
}
function startTask(t){
  P.task=t;P.tries=(P.tries||0);
  let goal;
  if(t.kind==='walk')goal=(x,y)=>x===t.x&&y===t.y;
  else if(t.kind==='field'){const self=!blocked('farm',t.x,t.y);goal=(x,y)=>near(x,y,t.x,t.y,1)&&(self||!(x===t.x&&y===t.y));}
  else if(t.kind==='npc'){const r=RT[t.id];if(!r||r.hidden||r.map!==S.map){P.task=null;return;}const nx=Math.round(r.x),ny=Math.round(r.y);r.wait=5;goal=(x,y)=>near(x,y,nx,ny,1)&&!(x===nx&&y===ny);}
  else if(t.kind==='bld'){goal=(x,y)=>x===t.sx&&y===t.sy;}
  const res=bfs(S.map,Math.round(P.x),Math.round(P.y),goal);
  if(!res){if(t.kind!=='walk')toast('岩にふさがれて行けない。手前の岩からくだこう');P.task=null;return;}
  P.path=res.path;
}
function updPlayer(dt){
  if(P.act){P.act.t+=dt;if(P.act.t>=P.act.dur){const a=P.act;P.act=null;a.done();}return;}
  if(moveAlong(P,dt,P.speed))return;
  if(P.task){const t=P.task;P.task=null;arrive(t);return;}
  if(Q.length)startTask(Q.shift());
}
async function arrive(t){
  if(t.kind==='field'){faceTo(P,t.x,t.y);doField(t.x,t.y,t.item);}
  else if(t.kind==='npc'){const r=RT[t.id];if(r&&!r.hidden&&r.map===S.map&&near(Math.round(P.x),Math.round(P.y),Math.round(r.x),Math.round(r.y),1.5)){faceTo(P,r.x,r.y);faceTo(r,P.x,P.y);r.wait=2;P.tries=0;await openNpc(t.id);r.wait=1;}
    else if((P.tries=(P.tries||0)+1)<4)startTask(t);else P.tries=0;}
  else if(t.kind==='bld'){if(t.face)P.dir=t.face;await interact(t.id);}
}
function doField(x,y,item){
  item=item||S.hand;const k=canAct(x,y,item),i=I(x,y);
  if(!k||typeof k==='object')return;   // 予約のあいだに様子が変わった
  const need=k==='till'?COST.till:k==='water'?COST.water:k==='rock'?COST.rock:0;
  if(need&&S.stamina<need){toast('つかれて動けない…今日は家で休もう');Q.length=0;return;}
  const tool=TOOLS[item]&&(k==='till'||k==='water'||k==='rock')?item:null;
  P.act={t:0,dur:k==='rock'?.5:.28,tool,done:()=>{
    S.stamina-=need;
    if(k==='till'){S.farm.soil[i]=1;dust(x*TS+8,y*TS+10,'#8a5a35',5);hint('till','つぎは下の板で種をえらんで、耕したマスをタップ');}
    else if(k==='plant'){S.seeds[item]--;S.farm.crop[i]={id:item,d:0,ready:false};hint('plant','じょうろに持ちかえて水やり。毎日やると育つよ');}
    else if(k==='water'){S.farm.wet[i]=1;splash(x*TS+8,y*TS+8);}
    else if(k==='harvest'){const c=S.farm.crop[i];S.inv[c.id]++;fxText(x*TS+8,y*TS,'+1 '+CROPS[c.id].name);const cd=CROPS[c.id];if(cd.regrow){c.d=cd.days-cd.regrow;c.ready=false;}else{S.farm.crop[i]=null;}hint('harvest','とれた作物は出荷箱へ。あげると喜ぶ住人もいるよ');}
    else if(k==='rock'){S.farm.rock[i]=0;S.inv.stone+=2;dust(x*TS+8,y*TS+8,'#9d978a',7);fxText(x*TS+8,y*TS,'+2 石');hint('rock','石は家の改築に使うよ。クロエの工房で相談しよう');}
    else if(k==='flower'){S.farm.flower[i]=0;S.inv.flower++;fxText(x*TS+8,y*TS,'+1 野の花');}
    updHud();
  }};
}

const STAND={home:{farm:[3,6,1]},ship:{farm:[12,6,1]},workshop:{town:[3,6,1]},shop:{town:[12,6,1]},houseA:{town:[2,21,1]},houseL:{town:[7,21,1]},houseC:{town:[12,21,1]}};
function onTap(cx,cy){
  if(busy())return;
  const wx=cx/view.sc+cam.x,wy=cy/view.sc+cam.y;const tx=Math.floor(wx/TS),ty=Math.floor(wy/TS);
  // 住人
  for(const id of Object.keys(RT)){const r=RT[id];if(r.hidden||r.map!==S.map)continue;
    if(wx>=r.x*TS-2&&wx<=r.x*TS+18&&wy>=r.y*TS-10&&wy<=r.y*TS+16){Q.length=0;interrupt();Q.push({kind:'npc',id});return;}}
  if(tx<0||ty<0||tx>=MW||ty>=MH)return;
  if(S.map==='farm'&&queueField(tx,ty)){mark(tx,ty);return;}
  const t=tile(S.map,tx,ty);const b=BLD[t];
  if(b&&b!=='tree'){
    Q.length=0;interrupt();
    const st=STAND[b]&&STAND[b][S.map];
    if(st)Q.push({kind:'bld',id:b,sx:st[0],sy:st[1],face:st[2]});
    else{const res=bfs(S.map,Math.round(P.x),Math.round(P.y),(x,y)=>DIRS.some(([dx,dy])=>x+dx===tx&&y+dy===ty));if(res){Q.push({kind:'bld',id:b,sx:res.end[0],sy:res.end[1]});}}
    return;
  }
  if(!blocked(S.map,tx,ty)){Q.length=0;interrupt();Q.push({kind:'walk',x:tx,y:ty});mark(tx,ty);}
}
function interrupt(){if(P.path.length>1)P.path=P.path.slice(0,1);P.task=null;}

const freeRooms=()=>S.reno.state===2?S.rooms.filter(x=>!x).length:0;
async function invite(id){

async function renovate(){

  const offer=d.offer.replace('{cost}',RENO.cost).replace('{stone}',RENO.stone);

/* ---------- 1日のおわりとはじまり ---------- */
async function sleep(passedOut){
  if(S.over)return;
  Q.length=0;P.path=[];P.task=null;
  const lines=[];
  // 出荷
  let pay=0,cnt=0;for(const k in S.ship){pay+=S.ship[k]*CROPS[k].sell;cnt+=S.ship[k];S.ship[k]=0;}
  // 作物
  for(let i=0;i<MW*MH;i++){const c=S.farm.crop[i];if(c&&!c.ready&&S.farm.wet[i]){c.d++;if(c.d>=CROPS[c.id].days)c.ready=true;}S.farm.wet[i]=0;}
  // 改築
  let renoDone=false;if(S.reno.state===1){S.reno.days--;if(S.reno.days<=0){S.reno.state=2;renoDone=true;}}
  // 部屋を見に来る（同居の場面は朝のカードのあと）
  for(const id of['chloe','luu']){const n=S.npc[id];if(n.pending){n.pending=false;n.visit=true;}}
  // 住人の毎日
  for(const id in S.npc){S.npc[id].talked=false;S.npc[id].gifted=false;}
  // 岩と花
  if(S.npc.chloe.live){let k=0;for(let t=0;t<40&&k<2;t++){const x=3+((Math.random()*10)|0),y=9+((Math.random()*11)|0),i=I(x,y);if(!S.farm.rock[i]&&!S.farm.soil[i]&&!S.farm.crop[i]&&!(y<=10&&(x===7||x===8))){S.farm.rock[i]=1;k++;}}fixRocks(S.farm);}
  S.farm.flower.fill(0);{let k=0;for(let t=0;t<60&&k<3;t++){const x=(Math.random()*MW)|0,y=(Math.random()*MH)|0;if(tile('farm',x,y)==='g'&&!(x===3&&y===6)){S.farm.flower[I(x,y)]=1;k++;}}}
  S.day++;S.time=DAY_START;S.stamina=passedOut?Math.round(S.maxSt*.7):S.maxSt;S.map='farm';P.x=3;P.y=6;P.dir=0;
  for(const id in RT){RT[id].hidden=true;RT[id].task=null;RT[id].path=[];RT[id].act=null;}
  if(pay){S.money+=pay;S.stats.earned+=pay;S.stats.shipped+=cnt;lines.push(`出荷のお金 ${pay}G が入った`);}
  if(passedOut)lines.unshift('つかれて眠ってしまった…（体力が少しへった）');
  if(renoDone){lines.push('家の増築ができた！部屋が2つふえた');}
  if(S.npc.luu.live)lines.push('ルゥが畑の水やりをしてくれる');
  if(S.npc.chloe.live)lines.push('クロエが畑の岩をくだいてくれる');
  renderBase('farm');
  if(S.day>SEASON_DAYS){S.over=true;save();return seasonEnd();}
  setFree(null);save();
  await dayCard(lines);
  await runVisits();
  if(S.day===2)hint('map','街へは下の「地図」から。住人と仲よくなろう');
}

  modalOpen=true;M.wrap.hidden=false;
  const render=()=>{M.panel.innerHTML=`<h2>${title}<small>${typeof sub==='function'?sub():sub||''}</small></h2>`;const list=document.createElement('div');list.className='plist';M.panel.appendChild(list);build(list,render);
    const c=document.createElement('button');c.className='close';c.textContent='とじる';c.onclick=close;M.panel.appendChild(c);};
  const close=()=>{M.wrap.hidden=true;modalOpen=false;updHud();onClose&&onClose();};
  render();return close;
}
function row(list,icon,t1,t2,btns){const r=document.createElement('div');r.className='row';
  r.innerHTML=`${icon?`<img alt="" src="${icon}">`:'<span></span>'}<div class="t"><div>${t1}</div>${t2?`<div>${t2}</div>`:''}</div>`;
  const a=document.createElement('div');a.className='acts';(btns||[]).forEach(b=>{const e=document.createElement('button');e.className='pbtn'+(b.sub?' sub':'');e.textContent=b.t;e.disabled=!!b.off;e.onclick=b.f;a.appendChild(e);});r.appendChild(a);list.appendChild(r);return r;}
function openShop(){
  let bought=false;
  return new Promise(res=>{openPanel(shopTitle(),()=>`もちもの ${S.money}G`,(list,re)=>{
    for(const k in CROPS){const c=CROPS[k];
      row(list,ICON[k],`${c.name}の種　${c.seed}G`,`${c.days}日で育つ・売ると${c.sell}G${c.regrow?`・とったあと${c.regrow}日でまた実る`:''}・持っている ${S.seeds[k]}`,[
        {t:'1つ',off:S.money<c.seed,f:()=>{S.money-=c.seed;S.seeds[k]++;bought=true;re();}},
        {t:'5つ',sub:true,off:S.money<c.seed*5,f:()=>{S.money-=c.seed*5;S.seeds[k]+=5;bought=true;re();}}]);}
    const n=document.createElement('p');n.className='note';n.textContent='春の種だけ。お金は作物を出荷箱に入れると、次の朝に入るよ';list.appendChild(n);
  },async()=>{if(bought)await say('shop',DLG.shop.bought);res();});});
}
function openShip(){
  return new Promise(res=>{openPanel('出荷箱',()=>{let v=0;for(const k in S.ship)v+=S.ship[k]*CROPS[k].sell;return v?`あしたの朝 ${v}G`:'入れたものは次の朝にお金になる';},(list,re)=>{
    let any=false;
    for(const k in CROPS){if(!S.inv[k])continue;any=true;const c=CROPS[k];
      row(list,ICON[k],`${c.name}　×${S.inv[k]}`,`1つ ${c.sell}G`,[{t:'1つ',f:()=>{S.inv[k]--;S.ship[k]++;re();}},{t:'全部',sub:true,f:()=>{S.ship[k]+=S.inv[k];S.inv[k]=0;re();}}]);}
    if(!any){const n=document.createElement('p');n.className='note';n.textContent='出荷できる作物を持っていないよ。畑で育てて収穫しよう';list.appendChild(n);}
  },res);});
}
function openBag(){
  openPanel('かばん','',(list)=>{
    for(const k in TOOLS){const lv=(S.tools&&S.tools[k])||1;row(list,HICON[k],`${TOOLS[k].name}　${TOOL_LV[lv]||'Lv'+lv}`,'下の板でえらんで使う。あとで強くできる（次の試作から）');}
    for(const k in ITEM_NAMES){if(!S.inv[k])continue;row(list,ICON[k],`${ITEM_NAMES[k]}　×${S.inv[k]}`,k==='stone'?'改築の材料（クロエの工房）':k==='flower'?'畑のまわりに毎朝さく':'出荷するか、住人にあげよう');}
    for(const k in CROPS){if(!S.seeds[k])continue;row(list,ICON[k],`${CROPS[k].name}の種　×${S.seeds[k]}`,'畑にまく');}
    if(!list.children.length){const n=document.createElement('p');n.className='note';n.textContent='からっぽ';list.appendChild(n);}
  });
}
function pickItem(title){
  return new Promise(res=>{let chosen=null;const close=openPanel(title,'',(list)=>{
    let any=false;for(const k in ITEM_NAMES){if(!S.inv[k])continue;any=true;row(list,ICON[k],`${ITEM_NAMES[k]}　×${S.inv[k]}`,'',[{t:'あげる',f:()=>{chosen=k;close();}}]);}
    if(!any){const n=document.createElement('p');n.className='note';n.textContent='あげられる物を持っていないよ。作物・石・野の花をあげられる';list.appendChild(n);}
  },()=>res(chosen));});
}
function openMap(){
  const go=(k,label)=>({t:'行く',f:async()=>{close();const[m,x,y]=SPOTS[k];await warp(m,x,y);toast(label);}});
  const close=openPanel('地図','行きたい所をタップ',(list)=>{
    row(list,null,'牧場','わたしの家・畑・出荷箱',[go('farmHome','牧場')]);
    row(list,null,'街の広場','噴水のまわり。ルゥがよく遊んでいる',[go('town','街の広場')]);
    row(list,null,'クロエの工房','改築の相談はここ（8時〜18時）',[go('workshop','クロエの工房')]);
    row(list,null,shopTitle(),'春の種を売っている（9時〜17時）',[go('shop','種屋')]);
  });
}
function openFriends(){
  const close=openPanel('なかよし','',(list)=>{
    for(const id of['chloe','luu']){const n=S.npc[id],d=DLG[id];const h=hearts(id);
      const st=n.live?'牧場で一緒に暮らしている':n.pending?'あしたの朝 部屋を見に来る':n.visit?'けさ 部屋を見に来る':!n.met?'まだ会っていない':h>=INVITE_HEARTS?'一緒に住もうと誘えそう':`♥${INVITE_HEARTS}になったら誘える`;
      const r=row(list,null,`${d.name}<span style="font-size:12px;color:#8f6038">　${id==='chloe'?'ドラゴン娘':'スライム娘'}</span>`,`<span class="hearts">${'♥'.repeat(h)}<i>${'♥'.repeat(MAX_HEARTS-h)}</i></span>　${st}`);
      const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d');g.drawImage(SPR[id][0][0],0,0,16,16,0,1,16,16);r.replaceChild(c,r.firstChild);}
    const hs=S.reno.state===0?`改築：まだ（クロエに${RENO.cost}Gと石${RENO.stone}個）`:S.reno.state===1?`改築：工事中（あと${S.reno.days}日）`:`改築：完成・部屋 ${S.rooms.filter(Boolean).length}/${RENO.rooms}`;
    const n=document.createElement('p');n.className='note';n.innerHTML=`${hs}<br>話す（1日1回）と贈り物（1日1回）で仲よくなれる。${OTHERS.length?`<br>ほかの住人：${OTHERS.join('・')}（次の試作から）`:''}`;list.appendChild(n);
    const rb=document.createElement('button');rb.className='pbtn sub';rb.style.marginTop='8px';rb.textContent='最初からやり直す';let armed=false;
    rb.onclick=()=>{if(!armed){armed=true;rb.textContent='もう一度押すと、データを消して最初から';return;}clearSave();location.reload();};list.appendChild(rb);
  });
}
async function warp(m,x,y){
  Q.length=0;P.path=[];P.task=null;fading=true;const f=$('#fade');f.innerHTML='';f.classList.add('on');await wait(350);
  S.map=m;P.x=x;P.y=y;P.dir=0;setFree(null);await wait(120);f.classList.remove('on');await wait(300);fading=false;
  if(m==='town')hint('town','クロエは工房、ルゥは噴水のまわりにいるよ。タップで話せる');
}
async function dayCard(lines){
  fading=true;const f=$('#fade');f.innerHTML=`<div class="d">春 ${S.day}日（${DOW[(S.day-1)%7]}）</div><div class="l">${lines.join('<br>')}</div>`;f.classList.add('on');
  updHud();await wait(lines.length?1700+lines.length*500:1100);f.classList.remove('on');await wait(350);fading=false;
}
function seasonEnd(){
  const live=['chloe','luu'].filter(id=>S.npc[id].live).map(id=>DLG[id].name);
  modalOpen=true;M.wrap.hidden=false;
  M.panel.innerHTML=`<h2>春がおわった<small>試作1はここまで</small></h2><div class="plist">
  <div class="row"><span></span><div class="t"><div>出荷で ${S.stats.earned}G かせいだ</div><div>出荷した作物 ${S.stats.shipped}こ</div></div></div>
  <div class="row"><span></span><div class="t"><div>一緒に暮らす仲間：${live.length?live.join('・'):'まだいない'}</div><div>クロエ ♥${hearts('chloe')}・ルゥ ♥${hearts('luu')}</div></div></div></div>`;
  const b=document.createElement('button');b.className='close';b.textContent='もう一度 春から';b.onclick=()=>{clearSave();location.reload();};M.panel.appendChild(b);
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- ループ ---------- */
let started=false,ff=1,last=performance.now(),saveT=0;
function update(dt){
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.add('off');}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)parts.splice(i,1);}
  for(let i=marks.length-1;i>=0;i--){marks[i].t-=dt;if(marks[i].t<=0)marks.splice(i,1);}
  if(busy())return;
  S.time+=dt*GMIN_PER_SEC*ff;
  if(S.time>=DAY_END){passOut();return;}
  if(S.time>=1320&&!S.flags['late'+S.day]){S.flags['late'+S.day]=1;toast('もう22時。そろそろ家に帰って寝よう');}
  updPlayer(dt);
  for(const id in RT)updNpc(id,dt);
  updClock();
  if((saveT+=dt)>20){saveT=0;save();}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(S)update(dt);render();requestAnimationFrame(loop);}

/* ---------- はじまり ---------- */
function initRT(){for(const id of['chloe','luu','shop']){RT[id]={map:'town',x:0,y:0,path:[],dir:0,anim:0,act:null,task:null,hidden:true,speed:id==='luu'?3.2:2.8,wait:0,idle:0,bub:0};}}
async function begin(fresh){
  $('#title').hidden=true;
  if(fresh){clearSave();S=newState();}
  if(!S.hand)S.hand='hoe';if(!S.tools)S.tools={hoe:1,can:1,pick:1};delete S.sel;
  P.x=S.px;P.y=S.py;P.dir=S.dir||0;setFree(null);
  renderBase('farm');renderBase('town');updHud();updClock();started=true;
  if(!S.flags.intro){S.flags.intro=true;
    const intro=DLG.intro&&DLG.intro.length?DLG.intro:[{who:'narr',text:'モン娘だけが暮らす街の、はずれの牧場。'},{who:'player',text:'今日からここが、わたしの牧場。がんばろう！'}];
    await scene(intro);toast('下の板でクワをえらんで、畑のマスをタップ。指でなぞると見わたせるよ');save();}
  await runVisits();
}
async function boot(){
  resize();addEventListener('resize',resize);
  await loadDLG();
  ['player','chloe','luu','shop'].forEach(makeSprites);
  OTHERS=(DLG.others||[]).map(o=>o.name||o);
  initRT();
  // タイトルの絵
  const tg=$('#tcv').getContext('2d');tg.imageSmoothingEnabled=false;
  for(let x=0;x<6;x++)drawGrass(tg,x,2);tg.drawImage(SPR.chloe[0][0],20,14);tg.drawImage(SPR.player[0][0],40,14);tg.drawImage(SPR.luu[0][0],60,14);
  drawCrop(tg,'kabu',3,4,28);drawCrop(tg,'ichigo',3,78,28);
  const sv=loadSave();if(sv){S=sv;$('#contBtn').hidden=false;}
  $('#newBtn').onclick=()=>begin(true);$('#contBtn').onclick=()=>begin(false);
  cv.addEventListener('pointerdown',e=>{if(ptr||!e.isPrimary)return;const b=cv.getBoundingClientRect();
    ptr={id:e.pointerId,sx:e.clientX,sy:e.clientY,bx:b.left,by:b.top,drag:false,cx:cam.x,cy:cam.y};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id)return;const dx=e.clientX-ptr.sx,dy=e.clientY-ptr.sy;
    if(!ptr.drag&&Math.hypot(dx,dy)>10)ptr.drag=true;
    if(ptr.drag&&S&&started){const[x,y]=clampCam(ptr.cx-dx/view.sc,ptr.cy-dy/view.sc);setFree({x,y});}});
  const endPtr=(e,cancel)=>{if(!ptr||e.pointerId!==ptr.id)return;const p=ptr;ptr=null;
    if(p.drag){if(S&&started)hint('pan','もどるときは右下の「自分にもどる」');}else if(!cancel)onTap(p.sx-p.bx,p.sy-p.by);};
  cv.addEventListener('pointerup',e=>endPtr(e,false));cv.addEventListener('pointercancel',e=>endPtr(e,true));
  recBtn.onclick=()=>setFree(null);
  $('#bagBtn').onclick=()=>{if(!busy())openBag();};
  $('#mapBtn').onclick=()=>{if(!busy())openMap();};
  $('#friendBtn').onclick=()=>{if(!busy())openFriends();};
  $('#ffBtn').onclick=e=>{ff=ff===1?8:1;e.currentTarget.setAttribute('aria-pressed',ff>1?'true':'false');e.currentTarget.textContent=ff>1?'早送り×8':'早送り';};
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started)save();});
  if(!sv)S=null;
  requestAnimationFrame(loop);
  window.__game={get S(){return S;},P,RT,Q,onTap,sleep,openNpc,view,cam,canAct};
}
boot();
})();
</script>
