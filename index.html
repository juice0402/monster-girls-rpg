<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LILITH | FX playable</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0815;color:#fff0ff;font:15px system-ui;text-align:center}h1{font:24px Georgia;margin:18px 0 4px;color:#f7c6ff}p{margin:5px 12px 12px;color:#d3badc;font-size:12px}.arena{width:min(96vw,650px);height:420px;position:relative;margin:auto;border:1px solid #754789;border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#49285d,#140f26 68%)}.floor{position:absolute;bottom:48px;width:100%;height:45px;border-bottom:2px solid #a86bc1;background:linear-gradient(transparent,#44265d77)}.actor{position:absolute;bottom:76px;left:9%;width:155px;height:235px;animation:idle 2.8s ease-in-out infinite;transform-origin:bottom}.enemy{position:absolute;right:10%;bottom:84px;width:110px;height:165px;filter:drop-shadow(0 0 12px #c65dd0);animation:idle 3.1s ease-in-out infinite}.fx{position:absolute;display:none;pointer-events:none;filter:drop-shadow(0 0 15px #df8aff)}.fx svg{width:100%;height:100%;overflow:visible}.fx.on{display:block}.guard{width:140px;height:185px;left:29%;bottom:122px}.guard.on{animation:guard 1.15s ease-out both}.bullet{width:140px;height:90px;left:calc(9% + 135px);bottom:208px}.bullet.on{animation:shot .9s linear both}.ultimate{width:260px;height:260px;right:0%;bottom:75px}.ultimate.on{animation:ultimate 1.8s ease-out both}.heal{width:170px;height:245px;left:8%;bottom:69px}.heal.on{animation:heal 1.7s ease-out both}.drain{width:140px;height:90px;right:22%;bottom:210px;transform:scaleX(-1)}.drain.on{animation:drain 1.2s linear both}button{background:#39234b;color:white;border:1px solid #ad79c6;border-radius:12px;padding:14px 16px;min-width:100px;font-weight:700;touch-action:manipulation}button:active{background:#8d4e9e}.controls{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:640px;margin:15px auto;padding:0 8px}.status{color:#ffd9fb;min-height:23px;margin:8px}.small{font-size:11px;max-width:600px;margin:12px auto;color:#bca8c9;line-height:1.6;padding:0 15px}@keyframes idle{50%{translate:0 -5px}}@keyframes guard{0%{opacity:0;scale:.6}25%,75%{opacity:1;scale:1}100%{opacity:0;scale:1.15}}@keyframes shot{0%{opacity:0;translate:0 0}12%,78%{opacity:1}100%{opacity:0;translate:260px 0}}@keyframes ultimate{0%{opacity:0;scale:.3;rotate:-25deg}35%,78%{opacity:1;scale:1.1;rotate:0}100%{opacity:0;scale:1.35}}@keyframes heal{0%{opacity:0;translate:0 65px;scale:1 .4}25%,75%{opacity:1;scale:1 1}100%{opacity:0;translate:0 -25px}}@keyframes drain{0%{opacity:0;translate:0 0}15%,80%{opacity:1}100%{opacity:0;translate:-235px 0}}@media(max-width:480px){.arena{height:370px}.actor{left:1%;width:135px;height:205px}.enemy{right:3%;width:95px}.bullet{left:calc(1% + 116px);bottom:192px}.guard{left:24%;bottom:112px}.ultimate{width:220px;height:220px}@keyframes shot{0%{opacity:0;translate:0 0}12%,78%{opacity:1}100%{opacity:0;translate:130px 0}}@keyframes drain{0%{opacity:0;translate:0 0}15%,80%{opacity:1}100%{opacity:0;translate:-130px 0}}}</style></head><body><h1>✦ LILITH ✦</h1><p>戦闘エフェクト配置・操作テスト</p><div class="arena"><div class="floor"></div><svg class="actor" viewBox="0 0 160 240" aria-label="リリス"><defs><linearGradient id="hair" x2="1" y2="1"><stop stop-color="#ebc3fa"/><stop offset="1" stop-color="#51326e"/></linearGradient><linearGradient id="dress" x2="1" y2="1"><stop stop-color="#a85bb2"/><stop offset=".5" stop-color="#29203c"/><stop offset="1" stop-color="#68427c"/></linearGradient></defs><path d="M55 100 Q-10 60 8 180 L56 151 M85 110 Q110 62 147 100 L126 169" fill="#864398" stroke="#d78bd7" stroke-width="3"/><path d="M42 45Q48 8 90 20Q142 32 122 142L36 155Z" fill="url(#hair)"/><path d="M71 28L56 0 93 22 112 2 111 48" fill="#41224e"/><path d="M62 48Q95 32 115 58L111 96Q90 121 65 91Z" fill="#f6c6c9"/><path d="M103 70l12 -2 -10 7" fill="#b03c85"/><path d="M67 110Q110 104 119 131L143 209 40 209Z" fill="url(#dress)" stroke="#d5a0d4" stroke-width="2"/><path d="M78 205L74 238M112 204L120 238" stroke="#31213b" stroke-width="17"/><path d="M112 125L148 112" stroke="#f6c4c8" stroke-width="16" stroke-linecap="round"/><circle cx="148" cy="112" r="11" fill="#ffe0d8"/><path d="M36 98Q20 165 44 202" fill="none" stroke="#be7cbf" stroke-width="9"/></svg><svg class="enemy" viewBox="0 0 110 165"><path d="M55 5L88 27 106 82 85 157 23 157 4 82 22 27Z" fill="#3d244e" stroke="#b35bc2" stroke-width="5"/><path d="M27 65l20 6 -18 8m54 -14 -20 6 18 8" stroke="#ff9ded" stroke-width="6" fill="none"/><path d="M36 108Q55 125 75 108" stroke="#a96dd0" stroke-width="4" fill="none"/></svg>
<div class="fx guard" id="guard"><svg viewBox="0 0 140 185"><defs><radialGradient id="g"><stop stop-color="#eac3ff" stop-opacity=".65"/><stop offset="1" stop-color="#7138a6" stop-opacity=".22"/></radialGradient></defs><path d="M70 5Q122 32 128 57V120Q113 153 70 181Q26 153 12 120V57Q18 32 70 5Z" fill="url(#g)" stroke="#f2c5ff" stroke-width="5"/><path d="M70 21Q109 43 112 64V112Q101 137 70 160Q38 137 28 112V64Q32 43 70 21Z" fill="none" stroke="#e7ad6e" stroke-width="3"/><path d="M70 41L84 77 70 112 56 77Z" fill="#e4a0ff" stroke="#fff2bf" stroke-width="3"/><path d="M32 88Q70 70 108 88" fill="none" stroke="#f4c6ff" stroke-width="3"/></svg></div>
<div class="fx bullet" id="bullet"><svg viewBox="0 0 140 90"><defs><radialGradient id="b"><stop stop-color="white"/><stop offset=".35" stop-color="#efadff"/><stop offset="1" stop-color="#5d2cbd" stop-opacity="0"/></radialGradient></defs><path d="M4 46Q54 5 111 43Q56 85 4 46Z" fill="#9c50cf" opacity=".5"/><ellipse cx="92" cy="45" rx="41" ry="39" fill="url(#b)"/><path d="M75 45L112 19 136 45 112 71Z" fill="#e6a7ff" stroke="#fff0c9" stroke-width="3"/><circle cx="110" cy="45" r="12" fill="white"/></svg></div>
<div class="fx ultimate" id="ultimate"><svg viewBox="0 0 260 260"><defs><radialGradient id="u"><stop stop-color="#fff0ff"/><stop offset=".28" stop-color="#ed93ed"/><stop offset=".8" stop-color="#7837b6" stop-opacity=".7"/><stop offset="1" stop-color="#7837b6" stop-opacity="0"/></radialGradient></defs><circle cx="130" cy="130" r="120" fill="url(#u)"/><circle cx="130" cy="130" r="100" fill="none" stroke="#f7cb94" stroke-width="4" stroke-dasharray="9 6"/><circle cx="130" cy="130" r="80" fill="none" stroke="#ffdbff" stroke-width="3"/><path d="M130 34L155 100 226 130 155 155 130 226 105 155 34 130 105 100Z" fill="#b35bd2" stroke="#fff0d2" stroke-width="4"/><path d="M130 85Q185 65 174 129Q160 177 130 174Q88 174 86 129Q82 85 130 85Z" fill="#742a9a" stroke="#ffb4ed" stroke-width="4"/><path d="M130 100Q158 85 160 127Q156 151 130 157Q104 151 100 127Q102 85 130 100Z" fill="#dc75d1"/><circle cx="130" cy="130" r="16" fill="#fff3ff"/></svg></div>
<div class="fx heal" id="heal"><svg viewBox="0 0 170 245"><defs><linearGradient id="h" x2="0" y2="1"><stop stop-color="#d2ffdf" stop-opacity="0"/><stop offset="1" stop-color="#84f5b5" stop-opacity=".75"/></linearGradient></defs><path d="M42 219L66 15H104L128 219Z" fill="url(#h)"/><ellipse cx="85" cy="220" rx="75" ry="18" fill="#a0f6c0" fill-opacity=".4" stroke="#d3ffdc" stroke-width="4"/><ellipse cx="85" cy="220" rx="52" ry="11" fill="none" stroke="#f7b8ee" stroke-width="4"/><path d="M85 45V8M66 27H104M30 100L45 80M125 80L140 100" stroke="#fff6de" stroke-width="5"/><g fill="#ffe1f9"><circle cx="40" cy="120" r="6"/><circle cx="125" cy="65" r="7"/><circle cx="84" cy="95" r="5"/></g></svg></div>
<div class="fx drain" id="drain"><svg viewBox="0 0 140 90"><path d="M4 45Q55 2 117 45Q55 88 4 45Z" fill="#8e47bc" opacity=".7"/><path d="M65 45L111 20 138 45 111 70Z" fill="#d883e9" stroke="#ffe6d5" stroke-width="4"/><circle cx="109" cy="45" r="14" fill="#fff2ff"/></svg></div></div>
<div class="controls"><button type="button" data-fx="bullet">✨ 魔弾</button><button type="button" data-fx="guard">🛡 ガード</button><button type="button" data-fx="ultimate">🌹 必殺技</button><button type="button" data-fx="heal">💚 回復</button><button type="button" data-fx="drain">🌙 マナ吸収</button></div><div class="status" id="status" aria-live="polite">技を選んでね</div><div class="small">操作できる独立FX検証版。魔弾は手から右へ水平移動、ガードは胸の前、回復は足元から、マナ吸収は敵から左へ。既存の本編index.htmlは変更していません。</div><script>
(function(){var timers={};var names={bullet:"魔弾",guard:"ガード",ultimate:"必殺技",heal:"回復",drain:"マナ吸収"};function play(id){document.querySelectorAll(".fx").forEach(function(el){el.classList.remove("on");clearTimeout(timers[el.id]);});var el=document.getElementById(id);void el.offsetWidth;el.classList.add("on");document.getElementById("status").textContent=names[id]+" 発動！";timers[id]=setTimeout(function(){el.classList.remove("on")},2000)}document.querySelectorAll("[data-fx]").forEach(function(btn){btn.addEventListener("click",function(){play(btn.getAttribute("data-fx"))})});})();</script></body></html>
